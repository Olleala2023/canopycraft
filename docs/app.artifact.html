<title>CanopyCraft</title>
<meta name="description" content="Расчёт односкатного навеса, пристроенного к дому: стропила, обрешётка, прогоны, столбы. Сосна и профильная труба по СП 20, СП 64, СП 16. Карта загрузки, эпюры, массы и смета.">
<meta name="theme-color" content="#12405E">
<meta property="og:type" content="website">
<meta property="og:title" content="CanopyCraft — расчёт навеса">
<meta property="og:description" content="Карта загрузки, эпюры и подбор сечений для навеса у дома. Сосна и профильная труба.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/**
 * Палитра — единственный источник цветов: её инлайнит index.html и из неё же
 * собирается help/help.css, чтобы страницы справки не разъезжались с калькулятором.
 */
:root{
  color-scheme:light;
  --paper:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F8FA; --sunk:#E4E9EE;
  --ink:#111820; --ink-2:#48545F; --ink-3:#7C8894;
  --rule:#D2DAE1; --rule-2:#BCC7D0;
  --accent:#12405E; --accent-2:#1D6791; --accent-soft:#E1EBF2;
  --u-low:#3D7EA6; --u-ok:#3E8E59; --u-warn:#C88A11; --u-bad:#BC382F;
  --grid:#CBD6DF;
}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1418; --surface:#161C22; --surface-2:#1C242B; --sunk:#0B0F13;
    --ink:#E7ECF1; --ink-2:#A7B3BE; --ink-3:#74808B;
    --rule:#2A333C; --rule-2:#3A4650;
    --accent:#8CBEDE; --accent-2:#6FA9CD; --accent-soft:#17252F;
    --u-low:#6DA8CB; --u-ok:#5CB37A; --u-warn:#E0AA3D; --u-bad:#E06B60;
    --grid:#233039;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1418; --surface:#161C22; --surface-2:#1C242B; --sunk:#0B0F13;
  --ink:#E7ECF1; --ink-2:#A7B3BE; --ink-3:#74808B;
  --rule:#2A333C; --rule-2:#3A4650;
  --accent:#8CBEDE; --accent-2:#6FA9CD; --accent-soft:#17252F;
  --u-low:#6DA8CB; --u-ok:#5CB37A; --u-warn:#E0AA3D; --u-bad:#E06B60;
  --grid:#233039;
}
/* Палитра вынесена в tokens.css — сборка склеивает их в этом порядке. */

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); margin:0;
  font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; font-size:14px; line-height:1.5;
}
.mono,input,select,button{font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
h1,h2,h3{font-family:Oswald,"IBM Plex Sans",sans-serif; font-weight:500; margin:0; letter-spacing:.02em}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px}

.shell{max-width:1560px; margin:0 auto; padding-block:14px 40px; padding-left:16px; padding-right:16px;
  display:flex; flex-direction:column; gap:12px}

/* ── шапка ── */
/* Шапка: слева имя и виды, справа показатели и кнопки. Кнопки собраны в один
   блок, поэтому на узком экране на вторую строку уезжает вся панель целиком,
   а не одна отбившаяся кнопка. */
.topbar{display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap;
  border-bottom:2px solid var(--ink); padding-bottom:10px}
.status{display:flex; align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap}
.tools{display:flex; align-items:center; gap:5px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end}
.brand{font-family:Oswald,sans-serif; font-size:19px; text-transform:uppercase; letter-spacing:.09em}
@media (max-width:1150px){ .brand small{display:none} }
.brand small{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.14em; color:var(--ink-3); display:block; text-transform:none; letter-spacing:.1em}
.tabs{display:flex; border:1px solid var(--rule-2)}
.tabs button{font:inherit; font-size:12.5px; padding:4px 12px; background:transparent; border:0; color:var(--ink-2); cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent); color:var(--paper)}
.btn{font:inherit; font-size:12.5px; padding:5px 10px; background:var(--surface); color:var(--ink);
  border:1px solid var(--rule-2); cursor:pointer}
.btn.icon{padding:5px 9px; font-size:13px}
.btn.icon.off{color:var(--ink-3); border-color:var(--rule)}
.btn:disabled{color:var(--ink-3); border-color:var(--rule); cursor:default}
.audio{display:inline-flex; gap:6px; align-items:center}
input[type=range].vol{width:72px; flex:0 0 auto; align-self:center; accent-color:var(--accent-2)}
.btn:hover{border-color:var(--accent-2); color:var(--accent-2)}
.btn.primary{background:var(--accent); color:var(--paper); border-color:var(--accent)}
.btn.primary:hover{opacity:.9; color:var(--paper)}
.verdict-pill{font-family:"IBM Plex Mono",monospace; font-size:12px; padding:4px 10px; border:1px solid; white-space:nowrap}
.cost-pill{background:var(--surface); color:var(--ink); border-color:var(--rule-2); cursor:pointer; font:inherit;
  font-family:"IBM Plex Mono",monospace; font-size:12px}
.cost-pill:hover{border-color:var(--accent-2)}
.cost-pill .delta{color:var(--ink-3); margin-left:6px}

/* ── три колонки ── */
.panes{display:grid; grid-template-columns:236px minmax(0,1fr) 260px; gap:0; align-items:start;
  border:1px solid var(--rule-2); background:var(--surface)}
.pane{padding:13px; min-width:0; overflow-wrap:anywhere}
.pane + .pane{border-left:1px solid var(--rule)}
.pane-title{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:9px}
.pane-title + .pane-title{margin-top:16px}

/* ── сворачивающиеся блоки панелей ── */
.grp{border-top:1px solid var(--rule)}
.grp:first-child{border-top:0}
.grp > summary{display:flex; align-items:center; gap:6px; cursor:pointer; list-style:none;
  padding:9px 0; margin:0; user-select:none}
.grp:first-child > summary{padding-top:0}
.grp > summary::-webkit-details-marker{display:none}
.grp > summary::after{content:''; margin-left:auto; width:6px; height:6px; border:solid var(--ink-3);
  border-width:0 1.5px 1.5px 0; transform:translateY(-2px) rotate(45deg); transition:transform .12s}
.grp[open] > summary::after{transform:translateY(1px) rotate(-135deg)}
.grp > summary:hover{color:var(--ink-2)}
.grp > summary:hover::after{border-color:var(--ink-2)}
.grp-body{padding-bottom:4px}
.grp-body > .field:last-child, .grp-body > .field:last-child .check{margin-bottom:0}

.field{display:flex; flex-direction:column; gap:2px; margin-bottom:8px}
.field label{font-size:11.5px; color:var(--ink-2); display:flex; justify-content:space-between; gap:8px}
.field label b{font-family:"IBM Plex Mono",monospace; font-weight:500; color:var(--ink)}
.field label .btn{white-space:nowrap; flex:0 0 auto}
.field .note{display:block; margin-top:3px; font-size:10.5px; line-height:1.4; color:var(--ink-3)}
/* окна и двери стены дома: строка на проём — вид и четыре размера */
.field-label{font-size:11.5px; color:var(--ink-2); display:flex; justify-content:space-between; gap:8px}
.ops{display:flex; flex-direction:column; gap:6px}
.op-row{padding:5px 6px; border:1px solid var(--rule); background:var(--surface-2)}
.op-head{display:flex; gap:5px; margin-bottom:4px}
.op-head .btn{flex:0 0 auto; padding:0 8px}
.op-nums{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:4px}
.field .op-num{display:flex; flex-direction:column; gap:1px; font-size:10px; color:var(--ink-3)}
.op-num input{padding:2px 3px; font-size:12px}
.op-units{font-size:10px; color:var(--ink-3)}
.help{
  flex:0 0 auto; display:inline-grid; place-items:center; width:15px; height:15px; padding:0;
  border:1px solid var(--rule-2); border-radius:50%; background:transparent; color:var(--ink-3); text-decoration:none;
  font-size:10px; line-height:1; font-family:"IBM Plex Mono",ui-monospace,monospace; cursor:pointer;
}
.help:hover, .help[aria-expanded="true"]{border-color:var(--accent-2); color:var(--accent-2)}
.check .help{margin-left:5px; vertical-align:middle}
.pane-title .help{margin-left:7px; vertical-align:-4px}
/* карточка пояснения у «?» — верхний слой Popover API, место задаёт tip.js */
.tip{position:fixed; inset:auto; margin:0; width:min(300px, calc(100vw - 16px)); max-height:min(60vh, 420px); overflow:auto;
  padding:10px 12px; background:var(--surface); color:var(--ink); border:1px solid var(--rule-2);
  border-left:3px solid var(--accent-2); font-size:12px; line-height:1.5}
.tip .tip-title{display:block; margin-bottom:4px; font-weight:600}
.tip p{margin:0 0 6px; color:var(--ink-2)}
.tip a{color:var(--accent-2)}
input[type=range]{width:100%; accent-color:var(--accent-2); height:16px; margin:0}
select,input[type=number]{font:inherit; font-size:12.5px; width:100%; padding:3px 5px;
  background:var(--surface-2); color:var(--ink); border:1px solid var(--rule-2)}
.check{display:flex; gap:7px; align-items:flex-start; font-size:12px; color:var(--ink-2); cursor:pointer; margin-bottom:6px}
.check input{margin-top:3px; accent-color:var(--accent-2)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}

/* ── сцена ── */
.stage{padding:0; display:flex; flex-direction:column; position:relative}
.zoombar{position:absolute; right:10px; top:10px; display:flex; gap:4px; align-items:center;
  background:var(--surface); border:1px solid var(--rule-2); padding:3px 5px; z-index:2}
.zoombar .btn{padding:0 9px; font-size:14px; line-height:1.5}
.zoomval{font-size:11px; color:var(--ink-3); min-width:46px; text-align:right}
.canvas{flex:0 0 auto; padding:10px; background:
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0/20px 20px,
  linear-gradient(90deg,var(--grid) 1px, transparent 1px) 0 0/20px 20px, var(--surface-2)}
/* SVG занимает весь контейнер: клеточное поле и есть рабочая зона чертежа */
.canvas svg{display:block; width:100%; height:100%; touch-action:none}
.canvas{cursor:grab; touch-action:none; overflow:hidden; height:min(72vh, 620px); min-height:380px}
.canvas:active{cursor:grabbing}
/* На широком экране чертёж — главное: область сцены по высоте окна и прилипает
   к верху, пока прокручиваются длинные панели по бокам. Поле забирает всю высоту,
   что остаётся после легенды и подсказки. 96px — шапка над сценой: на верху
   страницы сцена целиком в окне. */
@media (min-width:1001px){
  .stage{position:sticky; top:8px; align-self:start; height:calc(100vh - 96px); height:calc(100dvh - 96px); min-height:480px}
  .canvas{flex:1 1 auto; height:auto; min-height:380px}
  /* правая колонка тоже прилипает; она длиннее окна, поэтому прокручивается
     сама, не утаскивая за собой страницу */
  .side{position:sticky; top:8px; align-self:start; max-height:calc(100vh - 16px); max-height:calc(100dvh - 16px);
    overflow-y:auto; overscroll-behavior:contain}
}
g.pickable, g.draggable{cursor:pointer}
.hint{font-size:11.5px; color:var(--ink-3); padding:7px 13px; border-top:1px solid var(--rule)}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; padding:7px 13px; border-top:1px solid var(--rule); font-size:11px; color:var(--ink-2)}
.legend i{display:inline-block; width:15px; height:8px; margin-right:5px; vertical-align:1px}
/* подписи и штриховка не должны перехватывать клики по элементам схемы */
.canvas svg text, .canvas svg polyline, .canvas svg polygon{pointer-events:none}
g.pickable{cursor:pointer}
g.pickable text{pointer-events:none}
g.draggable{cursor:ew-resize}

/* ── инспектор ── */
.chk{display:grid; grid-template-columns:1fr auto; gap:1px 8px; font-size:12px; align-items:baseline; margin-bottom:7px}
.chk .nm{color:var(--ink-2)}
.chk .v{font-family:"IBM Plex Mono",monospace; font-weight:500}
.chk .bar{grid-column:1/-1; height:5px; background:var(--sunk); position:relative; overflow:hidden}
.chk .bar span{position:absolute; left:0; top:0; bottom:0; display:block}
.chk .fx{grid-column:1/-1; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3); overflow-wrap:anywhere}
.verdict{margin:10px 0; padding:9px 10px; font-size:12px; border-left:3px solid; background:var(--surface-2)}
.kv{display:flex; justify-content:space-between; gap:10px; font-size:12px; border-bottom:1px dotted var(--rule); padding:2px 0}
.kv span:last-child{font-family:"IBM Plex Mono",monospace; text-align:right}
.kv span{overflow-wrap:anywhere; min-width:0}
.kv span:first-child{flex-shrink:0; max-width:45%; overflow-wrap:normal}

/* ── сводка ── */
/* ── предупреждения над сводкой: то, чего расчёт не видит ── */
.warns{display:flex; flex-direction:column; gap:8px; margin-bottom:12px}
.warns:empty{display:none}
.warn{border-left:3px solid var(--u-warn); background:var(--surface-2); padding:10px 13px;
  font-size:12.5px; color:var(--ink-2); line-height:1.5}
.warn.bad{border-left-color:var(--u-bad)}
.warn b{color:var(--ink)}
.warn a{color:var(--accent-2)}

.summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px}
.card{border:1px solid var(--rule-2); background:var(--surface); padding:10px 12px; display:flex; flex-direction:column; gap:5px; cursor:pointer}
.card:hover{border-color:var(--accent-2)}
.card .t{font-family:Oswald,sans-serif; text-transform:uppercase; font-size:13px; letter-spacing:.05em}
.card .u{font-family:"IBM Plex Mono",monospace; font-size:22px; line-height:1}
.card .w{font-size:11.5px; color:var(--ink-2)}
.card .bar{height:5px; background:var(--sunk); position:relative; overflow:hidden}
.card .bar span{position:absolute; left:0; top:0; bottom:0}

.bom{border:1px solid var(--rule-2); background:var(--surface); padding:12px}
.opt-row td{padding-top:6px; padding-bottom:6px}
.opt-row.best td{background:var(--accent-soft)}
.opt-row .btn{padding:1px 9px; font-size:11.5px}
.save{color:var(--u-ok)}
.progress{height:4px; background:var(--sunk); margin-top:8px; position:relative; overflow:hidden}
.progress span{position:absolute; left:0; top:0; bottom:0; background:var(--accent-2); transition:width .2s}
.tbl{overflow-x:auto}
.tbl table{min-width:540px}
table{border-collapse:collapse; width:100%; font-size:12.5px}
th,td{text-align:left; padding:4px 10px 4px 0; border-bottom:1px solid var(--rule)}
th{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
td.n{text-align:right; font-family:"IBM Plex Mono",monospace}
.foot{font-size:11.5px; color:var(--ink-3); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  border-top:1px solid var(--rule-2); padding-top:10px}

/* ── отчёт ── */
#report{display:none}
@media print{
  /* печать всегда по-светлому: тёмная тема не должна делать отчёт светло-серым
     по белому. :root:root — чтобы по весу перебить и :root[data-theme="dark"],
     и :root:not([data-theme="light"]) из медиазапроса выше */
  :root:root{
    color-scheme:light;
    --paper:#FFF; --surface:#FFF; --surface-2:#FFF; --sunk:#FFF;
    --ink:#000; --ink-2:#333; --ink-3:#666;
    --rule:#999; --rule-2:#999;
    --accent:#000; --accent-2:#000; --accent-soft:#FFF;
    --u-low:#3D7EA6; --u-ok:#3E8E59; --u-warn:#C88A11; --u-bad:#BC382F;
    --grid:#CCC;
  }
  body{background:#fff}
  .shell > *:not(#report){display:none !important}
  #report{display:block; font-size:11pt; color:#000}
  #report h2{margin-top:14pt}
  #report table{font-size:9.5pt}
  #report th,#report td{border-bottom:1px solid #999}
  /* ссылка на расчёт длинная и без пробелов — переносится где угодно */
  #report .report-link{font-size:8.5pt; overflow-wrap:anywhere}
  #report .report-link a{color:inherit}
}

@media (max-width:1000px){
  .panes{grid-template-columns:1fr}
  .pane + .pane{border-left:0; border-top:1px solid var(--rule)}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

</style>
<script>
  // тема ставится до первой отрисовки: иначе при выбранной тёмной мелькает светлый фон
  try {
    var t = localStorage.getItem('canopycraft.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* приватный режим */ }
</script>

<div class="shell">

  <div class="topbar">
    <div class="brand">CanopyCraft<small>расчёт навеса у дома</small></div>
    <div class="tabs" role="group" aria-label="Вид">
      <button id="tab-plan" aria-pressed="true">План</button>
      <button id="tab-section" aria-pressed="false">Разрез</button>
      <button id="tab-diagrams" aria-pressed="false">Эпюры</button>
      <button id="tab-nodes" aria-pressed="false">Узлы</button>
      <button id="tab-wall" aria-pressed="false">Стена</button>
      <button id="tab-3d" aria-pressed="false">3D</button>
    </div>
    <div class="status">
      <span class="verdict-pill" id="verdict-pill">—</span>
      <button class="verdict-pill cost-pill" id="cost-pill" hidden title="Показать спецификацию и смету"></button>
    </div>
    <div class="tools">
      <button class="btn" id="btn-pick-all">Подобрать всё</button>
      <button class="btn" id="btn-cost-search">Подобрать по цене</button>
      <a class="btn" href="help/index.html" target="_blank" rel="noopener" id="btn-help">Справка</a>
      <button class="btn" id="btn-report">Отчёт</button>
      <button class="btn" id="btn-link" title="Скопировать ссылку на этот расчёт">Ссылка</button>
      <button class="btn icon" id="btn-undo" title="Отменить (Ctrl+Z)" aria-label="Отменить" disabled>↶</button>
      <button class="btn icon" id="btn-redo" title="Вернуть (Ctrl+Y)" aria-label="Вернуть" disabled>↷</button>
      <button class="btn" id="btn-reset">Сбросить</button>
      <span class="audio">
        <button class="btn icon" id="btn-theme" aria-label="Тема оформления">◐</button>
        <button class="btn icon" id="btn-audio" aria-label="Фоновая музыка">♪</button>
        <input type="range" class="vol" id="audio-vol" min="0" max="100" step="5" hidden aria-label="Громкость музыки">
      </span>
    </div>
  </div>

  <div class="panes">
    <aside class="pane" id="params"></aside>
    <section class="pane stage">
      <div class="canvas" id="canvas"></div>
      <div class="zoombar">
        <button class="btn" id="zoom-out" title="Отдалить" aria-label="Отдалить">−</button>
        <button class="btn" id="zoom-in" title="Приблизить" aria-label="Приблизить">+</button>
        <button class="btn" id="zoom-reset" title="Вписать целиком">⌂</button>
        <span class="zoomval mono" id="zoom-val">100 %</span>
      </div>
      <div class="legend">
        <span><i style="background:var(--u-low)"></i>U &lt; 0,5 запас</span>
        <span><i style="background:var(--u-ok)"></i>0,5–0,85 норма</span>
        <span><i style="background:var(--u-warn)"></i>0,85–1,0 предел</span>
        <span><i style="background:var(--u-bad)"></i>U &gt; 1,0 не проходит</span>
        <a class="help" href="help/u.html" target="_blank" rel="noopener" title="Справка: как читать коэффициент U" aria-label="Справка: как читать коэффициент U">?</a>
      </div>
      <div class="hint" id="hint"></div>
    </section>
    <aside class="pane side" id="side">
      <div id="inspector"></div>
      <div id="params-right"></div>
    </aside>
  </div>

  <div class="warns" id="warns"></div>
  <div class="summary" id="summary"></div>
  <div class="bom" id="search" hidden></div>
