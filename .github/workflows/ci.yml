# Проверки на каждый PR и на main.
#
# Ставятся только инструменты разработки (esbuild, ESLint) — версии точно по
# package-lock.json. Проверки: ESLint, тесты, собранные файлы соответствуют
# исходникам, смоук интерфейса. Сверка сборки важна потому, что index.html публикуется как есть: поправили src/,
# забыли npm run build — и в main уезжает приложение старой версии, хотя
# тесты по исходникам зелёные.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Инструменты сборки и проверки
        run: npm ci

      - name: Проверка кода (ESLint)
        run: npm run lint

      - name: Тесты
        run: npm test

      - name: Сборка совпадает с исходниками
        run: |
          npm run build
          built="index.html docs/app.artifact.html help/help.css"
          if ! git diff --quiet -- $built; then
            echo "::error::Собранные файлы не совпадают с исходниками. Запустите npm run build и закоммитьте результат."
            git --no-pager diff --stat -- $built
            exit 1
          fi
          echo "Собранные файлы совпадают с исходниками."
      - name: Смоук-тест интерфейса
        # Chrome на раннерах ubuntu-latest уже установлен; тест открывает
        # собранный index.html и проходит интерфейс целиком — см. tools/smoke.mjs
        run: npm run smoke

      - name: Скриншоты интерфейса
        # светлая и тёмная темы на компьютере, ширина телефона — для глазной
        # сверки в PR: вкладка Summary прогона → Artifacts → smoke-shots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-shots
          path: smoke-shots/
          retention-days: 14
          if-no-files-found: ignore
