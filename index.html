/** Отрисовка: план, разрез, эпюры. Чистые функции — строка SVG + метрика для попадания курсора. */


const uColor = (U) =>
  U > 1 ? 'var(--u-bad)' : U > 0.85 ? 'var(--u-warn)' : U > 0.5 ? 'var(--u-ok)' : 'var(--u-low)';

const f2 = (x) => x.toFixed(2).replace('.', ',');
const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
const mono = 'IBM Plex Mono, ui-monospace, monospace';

function dimH(x1, x2, y, text, color = 'var(--ink-3)') {
  return `<g pointer-events="none"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}"/>
   <line x1="${x1}" y1="${y - 4}" x2="${x1}" y2="${y + 4}" stroke="${color}"/>
   <line x1="${x2}" y1="${y - 4}" x2="${x2}" y2="${y + 4}" stroke="${color}"/>
   <text x="${(x1 + x2) / 2}" y="${y - 5}" font-size="10" text-anchor="middle" font-family="${mono}" fill="${color}">${text}</text></g>`;
}
function dimV(y1, y2, x, text, color = 'var(--ink-3)') {
  return `<g pointer-events="none"><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${color}"/>
   <line x1="${x - 4}" y1="${y1}" x2="${x + 4}" y2="${y1}" stroke="${color}"/>
   <line x1="${x - 4}" y1="${y2}" x2="${x + 4}" y2="${y2}" stroke="${color}"/>
   <text transform="translate(${x - 5},${(y1 + y2) / 2}) rotate(-90)" font-size="10" text-anchor="middle" font-family="${mono}" fill="${color}">${text}</text></g>`;
}

/* ───────────────────────────── ПЛАН ───────────────────────────── */

function drawPlan(res, sel) {
  const m = res.model, g = m.geom;
  const pad = { l: 60, r: 34, t: 44, b: 68 };
  const sc = Math.min(780 / g.B, 360 / (g.L + g.a));
  const W = g.B * sc, H = (g.L + g.a) * sc;
  const vw = W + pad.l + pad.r, vh = H + pad.t + pad.b;
  const X = (x) => pad.l + x * sc, Y = (y) => pad.t + y * sc;
  const s = [];
  s.push(`<svg viewBox="0 0 ${vw} ${vh}" role="img" aria-label="План навеса с картой загрузки">`);
  s.push(`<defs><linearGradient id="drift" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--u-bad)" stop-opacity=".28"/>
    <stop offset="1" stop-color="var(--u-bad)" stop-opacity="0"/></linearGradient></defs>`);

  s.push(`<rect x="${X(0)}" y="${Y(0)}" width="${W}" height="${H}" fill="var(--surface)" stroke="var(--rule-2)"/>`);
  if (res.snow.driftLength > 0) {
    const bd = Math.min(H, res.snow.driftLength * sc);
    s.push(`<rect x="${X(0)}" y="${Y(0)}" width="${W}" height="${bd}" fill="url(#drift)"/>`);

  }
  s.push(`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(g.B)}" y2="${Y(0)}" stroke="var(--ink)" stroke-width="5"/>`);
  s.push(`<text x="${X(0)}" y="${Y(0) - 12}" font-size="10" font-family="${mono}" fill="var(--ink-2)" letter-spacing="1.3">СТЕНА ДОМА · газоблок ${m.wallPosts.wallThickness} мм, столбы на сквозных шпильках М${m.wallPosts.boltDiameter}</text>`);
  s.push(`<g class="pickable" data-pick="wallPurlin"><rect x="${X(0)}" y="${Y(0)}" width="${W}" height="12" fill="transparent"/>
    <line x1="${X(0)}" y1="${Y(0) + 5}" x2="${X(g.B)}" y2="${Y(0) + 5}" stroke="${uColor(res.wallPurlin.U)}" stroke-width="5"/>
    <title>Обвязка у стены ${res.wallPurlin.sec.label} · U ${f2(res.wallPurlin.U)}</title></g>`);

  // стропила
  const rsec = res.rafters[0]?.sec;
  const tw = Math.max(2.5, (rsec?.b ?? 50) * sc * 0.9);
  res.rafters.forEach((r, i) => {
    const x = X(r.x);
    const on = sel.type === 'rafter' && sel.index === i;
    s.push(`<g class="pickable draggable" data-pick="rafter" data-index="${i}">`);
    s.push(`<rect x="${x - 9}" y="${Y(0)}" width="18" height="${H}" fill="transparent"/>`);
    s.push(`<line x1="${x}" y1="${Y(0)}" x2="${x}" y2="${Y(g.L + g.a)}" stroke="${uColor(r.U)}" stroke-width="${tw}" opacity="${on ? 1 : 0.85}"/>`);
    if (on) s.push(`<line x1="${x}" y1="${Y(0) - 5}" x2="${x}" y2="${Y(g.L + g.a) + 5}" stroke="var(--ink)" stroke-dasharray="3 3"/>`);
    s.push(`<text x="${x}" y="${Y(g.L + g.a) + 13}" font-size="9.5" text-anchor="middle" font-family="${mono}" fill="${uColor(r.U)}">${f2(r.U)}</text>`);
    s.push(`<title>Стропило ${i + 1} · ${r.sec.label} · грузовая ${Math.round(r.trib)} мм · U ${f2(r.U)} (${r.worst?.name})</title></g>`);
  });

  // прогон
  s.push(`<g class="pickable" data-pick="purlin"><rect x="${X(0)}" y="${Y(g.L) - 7}" width="${W}" height="14" fill="transparent"/>
    <line x1="${X(0)}" y1="${Y(g.L)}" x2="${X(g.B)}" y2="${Y(g.L)}" stroke="${uColor(res.purlin.U)}" stroke-width="5"/>
    <title>Прогон ${res.purlin.sec.label} · U ${f2(res.purlin.U)}</title></g>`);

  // столбы
  res.posts.forEach((p, i) => {
    const px = X(p.x), py = Y(g.L), sz = 11;
    s.push(`<g class="pickable draggable" data-pick="post" data-index="${i}">
      <rect x="${px - 10}" y="${py - 10}" width="20" height="20" fill="transparent"/>
      <rect x="${px - sz / 2}" y="${py - sz / 2}" width="${sz}" height="${sz}" fill="var(--surface)" stroke="${uColor(p.U)}" stroke-width="2.6"/>
      <title>Столб ${i + 1} · ${p.sec.label} · N ${f2(p.N / 1000)} кН · U ${f2(p.U)}</title></g>`);
  });
  if (sel.type === 'post') {
    const px = X(res.posts[sel.index]?.x ?? 0);
    s.push(`<circle cx="${px}" cy="${Y(g.L)}" r="13" fill="none" stroke="var(--ink)" stroke-dasharray="3 3"/>`);
  }

  res.wallPosts.forEach((p, i) => {
    const px = X(p.x), py = Y(0) + 5, sz = 10;
    s.push(`<g class="pickable draggable" data-pick="wallPost" data-index="${i}">
      <rect x="${px - 10}" y="${py - 10}" width="20" height="20" fill="transparent"/>
      <rect x="${px - sz / 2}" y="${py - sz / 2}" width="${sz}" height="${sz}" fill="var(--surface)" stroke="${uColor(p.U)}" stroke-width="2.6"/>
      <title>Столб у стены ${i + 1} · ${p.sec.label} · N ${f2(p.N / 1000)} кН · U ${f2(p.U)}</title></g>`);
  });
  if (sel.type === 'wallPost') {
    const px = X(res.wallPosts[sel.index]?.x ?? 0);
    s.push(`<circle cx="${px}" cy="${Y(0) + 5}" r="13" fill="none" stroke="var(--ink)" stroke-dasharray="3 3"/>`);
  }

  // обрешётка — тонкими штрихами
  const nB = Math.floor((g.L + g.a) / m.battens.spacing);
  for (let i = 1; i <= nB; i++) {
    const y = Y(Math.min(g.L + g.a, i * m.battens.spacing));
    s.push(`<line x1="${X(0)}" y1="${y}" x2="${X(g.B)}" y2="${y}" stroke="${uColor(res.battens.U)}" stroke-width="1" opacity=".35"/>`);
  }

  if (res.snow.driftLength > 0) {
    const dl = `снеговой мешок · μ = ${f2(res.snow.muWall)} · ${f2(res.snow.muWall * res.snow.Sg * 1.4)} кПа расчётных`;
    s.push(`<rect x="${X(0) + 5}" y="${Y(0) + 5}" width="${dl.length * 5.6}" height="16" fill="var(--surface)" opacity=".94" stroke="var(--u-bad)" stroke-opacity=".4" pointer-events="none"/>`);
    s.push(`<text x="${X(0) + 9}" y="${Y(0) + 17}" font-size="10" font-family="${mono}" fill="var(--u-bad)">${dl}</text>`);
  }
  s.push(dimH(X(0), X(g.B), Y(g.L + g.a) + 34, `${g.B}`));
  s.push(dimV(Y(0), Y(g.L), X(0) - 26, `${g.L}`));
  if (g.a > 0) s.push(dimV(Y(g.L), Y(g.L + g.a), X(0) - 26, `${g.a}`, 'var(--u-warn)'));
  const steps = [];
  for (let i = 1; i < res.rafters.length; i++) steps.push(Math.round(res.rafters[i].x - res.rafters[i - 1].x));
  const uniq = [...new Set(steps)];
  s.push(`<text x="${X(g.B)}" y="${Y(g.L + g.a) + 50}" font-size="10" text-anchor="end" font-family="${mono}" fill="var(--ink-3)">шаг стропил ${uniq.length === 1 ? uniq[0] : `${Math.min(...steps)}…${Math.max(...steps)}`} мм</text>`);
  s.push('</svg>');
  return { svg: s.join(''), meta: { sc, ox: pad.l, oy: pad.t, vw, vh } };
}

/* ──────────────────────────── РАЗРЕЗ ──────────────────────────── */

function drawSection(res) {
  const m = res.model, g = m.geom;
  const lv = levels(m);
  const al = (g.alpha * Math.PI) / 180, tg = Math.tan(al);
  const total = g.L + g.a;
  const totalH = lv.houseRoof + 700;
  const pad = { l: 142, r: 48, t: 30, b: 66 };
  const sc = Math.min(680 / (total + 700), 380 / totalH);
  const vw = (total + 800) * sc + pad.l + pad.r;
  const vh = totalH * sc + pad.t + pad.b;
  const X = (x) => pad.l + (x + 420) * sc;
  const Y = (y) => pad.t + (totalH - y) * sc; // y — высота от верха фундамента
  const s = [];
  const sec = (id) => section(id);
  s.push(`<svg viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Разрез навеса">`);

  // ── дом
  const eave = 260; // свес кровли дома над стеной — снег сходит именно отсюда
  s.push(`<rect x="${X(-420)}" y="${Y(lv.houseRoof)}" width="${420 * sc}" height="${lv.houseRoof * sc}" fill="var(--sunk)" stroke="var(--rule-2)"/>`);
  s.push(`<line x1="${X(-420)}" y1="${Y(lv.houseRoof + 620)}" x2="${X(eave)}" y2="${Y(lv.houseRoof)}" stroke="var(--ink-2)" stroke-width="1.5"/>`);
  s.push(`<line x1="${X(-420)}" y1="${Y(lv.houseRoof)}" x2="${X(eave)}" y2="${Y(lv.houseRoof)}" stroke="var(--ink-2)" stroke-width="3"/>`);
  s.push(`<text x="${X(eave) + 8}" y="${Y(lv.houseRoof) - 6}" font-size="10" font-family="${mono}" fill="var(--ink-2)">кровля дома — снег сходит отсюда</text>`);
  s.push(`<text transform="translate(${X(-210)},${Y(lv.postTop * 0.3)}) rotate(-90)" font-size="11" text-anchor="middle" font-family="${mono}" fill="var(--ink-3)">ДОМ</text>`);

  // ── размерная цепочка слева
  const xDim = X(-420) - 30;
  s.push(`<line x1="${xDim - 6}" y1="${Y(lv.houseRoof)}" x2="${X(-420)}" y2="${Y(lv.houseRoof)}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="4 3" opacity=".7" pointer-events="none"/>`);
  for (const hv of [0, lv.canopyTopWall]) {
    s.push(`<line x1="${xDim - 6}" y1="${Y(hv)}" x2="${X(120)}" y2="${Y(hv)}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="4 3" opacity=".7" pointer-events="none"/>`);
  }
  s.push(dimV(Y(0), Y(lv.canopyTopWall), xDim, `${Math.round(lv.canopyTopWall)} до верха навеса`, 'var(--u-warn)'));
  s.push(dimV(Y(lv.canopyTopWall), Y(lv.houseRoof), xDim, `перепад ${g.driftH} до кровли дома`, 'var(--u-bad)'));

  // ── снег: эпюра лежит на верхней кромке стропил
  const kPa = 70; // мм чертежа на 1 кПа снега
  const top = (x) => lv.canopyTopWall - x * tg;
  const pts = [];
  for (let i = 0; i <= 24; i++) {
    const x = (total * i) / 24;
    pts.push(`${X(x)},${Y(top(x) + res.snow.at(x) * kPa)}`);
  }
  s.push(`<polygon points="${X(0)},${Y(top(0))} ${pts.join(' ')} ${X(total)},${Y(top(total))}" fill="var(--u-bad)" fill-opacity=".18" stroke="var(--u-bad)" stroke-width="1" pointer-events="none"/>`);
  s.push(`<text x="${X(150)}" y="${Y(top(0) + res.snow.at(0) * kPa) - 7}" font-size="10" font-family="${mono}" fill="var(--u-bad)">снег ${f2(res.snow.at(0))} → ${f2(res.snow.at(total))} кПа (нормативный)</text>`);

  // ── ветер
  s.push('<g stroke="var(--accent-2)" fill="var(--accent-2)" pointer-events="none">');
  for (let i = 1; i <= 4; i++) {
    const x = (total * i) / 5, y0 = Y(top(x));
    s.push(`<line x1="${X(x)}" y1="${y0 - 5}" x2="${X(x)}" y2="${y0 - 26}"/><polygon points="${X(x) - 3},${y0 - 24} ${X(x) + 3},${y0 - 24} ${X(x)},${y0 - 31}"/>`);
  }
  s.push(`</g><text x="${X(total)}" y="${Y(lv.canopyTopWall) - 36}" font-size="10" text-anchor="end" font-family="${mono}" fill="var(--accent-2)">ветровой отрыв ${f2(res.wind.up)} кПа</text>`);

  // ── стропило: наклонный брус по нижней кромке от обвязки до конца свеса
  const rH = lv.rafterH * sc;
  const rU = Math.max(...res.rafters.map((r) => r.U));
  const x1 = X(0), y1 = Y(lv.rafterBottomWall), x2 = X(total), y2 = Y(lv.rafterBottomWall - total * tg);
  const len = Math.hypot(x2 - x1, y2 - y1);
  s.push(`<rect x="${x1}" y="${y1 - rH}" width="${len}" height="${rH}" fill="${uColor(rU)}" opacity=".92" stroke="var(--surface)" stroke-width="1"
     transform="rotate(${(Math.atan2(y2 - y1, x2 - x1) * 180) / Math.PI} ${x1} ${y1})"/>`);
  // подпись уклона — под стропилом, чтобы не налезала на снег
  s.push(`<text x="${X(total * 0.45)}" y="${Y(lv.rafterBottomWall - total * 0.45 * tg) + 24}" font-size="10" text-anchor="middle" font-family="${mono}" fill="var(--ink-2)">уклон ${g.alpha}° · стропило ${sec(m.rafters.sectionId).label}</text>`);

  // ── обвязка у стены и стеновой столб
  const wpS = sec(m.wallPosts.sectionId), wbS = sec(m.wallPurlin.sectionId);
  s.push(`<rect x="${X(0)}" y="${Y(lv.rafterBottomWall)}" width="${Math.max(3, wbS.b * sc)}" height="${lv.wallPurlinH * sc}" fill="${uColor(res.wallPurlin.U)}" opacity=".95" stroke="var(--surface)" stroke-width="1"/>`);
  s.push(`<rect x="${X(0)}" y="${Y(lv.wallPostTop)}" width="${Math.max(4, wpS.b * sc)}" height="${lv.wallPostTop * sc}" fill="${uColor(res.wallPosts[0].U)}" opacity=".9" stroke="var(--surface)" stroke-width="1"/>`);
  const nb = m.wallPosts.boltCount;
  for (const hy of boltHeights(lv.wallPostTop, nb)) {
    s.push(`<line x1="${X(-m.wallPosts.wallThickness)}" y1="${Y(hy)}" x2="${X(90)}" y2="${Y(hy)}" stroke="var(--ink)" stroke-width="1.6"/>`);
    s.push(`<rect x="${X(-m.wallPosts.wallThickness) - 4}" y="${Y(hy) - 6}" width="5" height="12" fill="var(--ink)"/>`);
  }
  s.push(`<text x="${X(130)}" y="${Y(lv.wallPostTop * 0.62)}" font-size="9.5" font-family="${mono}" fill="var(--ink-2)">${nb} × М${m.wallPosts.boltDiameter} сквозь газоблок ${m.wallPosts.wallThickness}</text>`);
  s.push(`<text x="${X(130)}" y="${Y(lv.wallPostTop * 0.62) + 13}" font-size="9.5" font-family="${mono}" fill="var(--ink-3)">столб ${wpS.label} · ${Math.round(lv.wallPostLength)} мм</text>`);
  s.push(`<text x="${X(130)}" y="${Y(lv.wallPostTop * 0.62) + 26}" font-size="9.5" font-family="${mono}" fill="var(--ink-3)">обвязка ${wbS.label}</text>`);

  // ── наружный прогон и столб
  const pS = sec(m.purlin.sectionId), poS = sec(m.posts.sectionId);
  s.push(`<rect x="${X(g.L) - (pS.b * sc) / 2}" y="${Y(lv.rafterBottomOuter)}" width="${Math.max(3, pS.b * sc)}" height="${lv.purlinH * sc}" fill="${uColor(res.purlin.U)}" opacity=".95" stroke="var(--surface)" stroke-width="1"/>`);
  s.push(`<rect x="${X(g.L) - (poS.b * sc) / 2}" y="${Y(lv.postTop)}" width="${Math.max(4, poS.b * sc)}" height="${lv.postTop * sc}" fill="${uColor(res.posts[0].U)}" opacity=".9" stroke="var(--surface)" stroke-width="1"/>`);
  s.push(`<text x="${X(g.L) - 14}" y="${Y(lv.postTop * 0.3)}" font-size="9.5" text-anchor="end" font-family="${mono}" fill="var(--ink-3)">столб ${poS.label} · ${Math.round(lv.postLength)} мм</text>`);
  s.push(`<text x="${X(g.L) - 14}" y="${Y(lv.postTop * 0.3) + 13}" font-size="9.5" text-anchor="end" font-family="${mono}" fill="var(--ink-3)">прогон ${pS.label}</text>`);

  // ── фундамент
  const fs = Math.max(300, res.foundation.cubeSide);
  s.push(`<rect x="${X(g.L) - (fs * sc) / 2}" y="${Y(0)}" width="${fs * sc}" height="${fs * sc * 0.55}" fill="var(--sunk)" stroke="var(--rule-2)"/>`);
  s.push(`<text x="${X(g.L)}" y="${Y(0) + fs * sc * 0.55 + 26}" font-size="9.5" text-anchor="middle" font-family="${mono}" fill="var(--ink-3)">фундамент ≈ ${Math.round(fs)} мм</text>`);

  // ── размеры
  s.push(dimH(X(0), X(g.L), Y(0) + 34, `${g.L}`));
  s.push(dimH(X(g.L), X(total), Y(0) + 34, `${g.a}`, 'var(--u-warn)'));
  s.push(dimV(Y(0), Y(lv.postTop), X(total) + 30, `${Math.round(lv.postTop)} наружный столб`));
  s.push('</svg>');
  return { svg: s.join(''), meta: null };
}

/* ──────────────────────────── ЭПЮРЫ ──────────────────────────── */

function chart(title, xs, ys, W, H, x0, y0, color, unit, scaleY, flip = false) {
  const maxA = Math.max(1e-9, ...ys.map(Math.abs));
  const k = (H / 2 / maxA) * 0.92 * (flip ? -1 : 1);
  const pts = [];
  for (let i = 0; i < xs.length; i += 2) {
    pts.push(`${(x0 + (W * xs[i]) / xs[xs.length - 1]).toFixed(1)},${(y0 + H / 2 - ys[i] * k).toFixed(1)}`);
  }
  return `<g><text x="${x0}" y="${y0 - 5}" font-size="10" font-family="${mono}" fill="var(--ink-3)" letter-spacing="1.1">${title}</text>
   <line x1="${x0}" y1="${y0 + H / 2}" x2="${x0 + W}" y2="${y0 + H / 2}" stroke="var(--rule-2)"/>
   <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.6"/>
   <text x="${x0 + W}" y="${y0 - 5}" font-size="10" text-anchor="end" font-family="${mono}" fill="${color}">max ${(maxA * scaleY).toFixed(2).replace('.', ',')} ${unit}</text></g>`;
}

function emptyDiagrams(text) {
  return {
    svg: `<svg viewBox="0 0 600 90" role="img" aria-label="${esc(text)}">
      <text x="300" y="46" font-size="13" text-anchor="middle" font-family="${mono}" fill="var(--ink-3)">${esc(text)}</text></svg>`,
    meta: null,
  };
}

function drawDiagrams(res, sel) {
  const el = pickElement(res, sel);
  if (!el) return emptyDiagrams('Выберите элемент на плане или в сводке внизу');
  if (!el.res) return emptyDiagrams(`Для элемента «${el.title.toLowerCase()}» эпюры не строятся`);
  const r = el.res.uls ?? el.res['ULS-1'];
  const sls = el.res.sls ?? el.res.SLS;
  const vertical = el.kind === 'post' || el.kind === 'wallPost';
  const W = 720, H = 84, pad = { l: 46, r: 26, t: 48 }; // сверху оставлено место под панель масштаба
  const vw = W + pad.l + pad.r, vh = 3 * (H + 34) + pad.t;
  const xs = Array.from(r.x);
  const s = [`<svg viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Эпюры">`];
  s.push(chart(`ЭПЮРА M · ${el.title}${vertical ? ' · по высоте от базы' : ' · на растянутом волокне'}`,
    xs, Array.from(r.M), W, H, pad.l, pad.t, 'var(--accent-2)', 'кН·м', 1e-6, true));
  s.push(chart(vertical ? 'ПОПЕРЕЧНАЯ СИЛА' : 'ЭПЮРА Q', xs, Array.from(r.V), W, H, pad.l, pad.t + H + 34, 'var(--u-ok)', 'кН', 1e-3));
  s.push(chart(vertical ? 'ГОРИЗОНТАЛЬНОЕ СМЕЩЕНИЕ' : 'ПРОГИБ (нормативные нагрузки)',
    xs, Array.from(sls.w), W, H, pad.l, pad.t + 2 * (H + 34), 'var(--u-warn)', 'мм', 1));
  for (const sup of r.reactions) {
    const x = pad.l + (W * sup.x) / xs[xs.length - 1];
    s.push(`<line x1="${x}" y1="${pad.t}" x2="${x}" y2="${vh - 8}" stroke="var(--ink-3)" stroke-dasharray="2 4" opacity=".7"/>`);
    s.push(`<text x="${x + 3}" y="${vh - 2}" font-size="9" font-family="${mono}" fill="var(--ink-3)">${f2(sup.R / 1000)} кН</text>`);
    if (vertical) s.push(`<text x="${x + 3}" y="${vh - 12}" font-size="8.5" font-family="${mono}" fill="var(--ink-3)">${Math.round(sup.x)}</text>`);
  }
  s.push('</svg>');
  return { svg: s.join(''), meta: null };
}

/** Элемент, выбранный в интерфейсе. */
function pickElement(res, sel) {
  if (sel.type === 'rafter') {
    const r = res.rafters[sel.index] ?? res.rafters[0];
    return r && { ...r, title: `СТРОПИЛО ${(sel.index ?? 0) + 1}`, kind: 'rafter' };
  }
  if (sel.type === 'purlin') return { ...res.purlin, title: 'ПРОГОН', kind: 'purlin' };
  if (sel.type === 'wallPurlin') return { ...res.wallPurlin, title: 'ОБВЯЗКА У СТЕНЫ', kind: 'wallPurlin' };
  if (sel.type === 'wallPost') {
    const p = res.wallPosts[sel.index] ?? res.wallPosts[0];
    return p && { ...p, title: `СТОЛБ У СТЕНЫ ${(sel.index ?? 0) + 1}`, kind: 'wallPost', res: { uls: p.diagram, sls: p.diagram } };
  }
  if (sel.type === 'battens') return { ...res.battens, title: 'ОБРЕШЁТКА', res: { uls: res.battens.res.uls, sls: res.battens.res.sls }, kind: 'battens' };
  if (sel.type === 'post') {
    const p = res.posts[sel.index] ?? res.posts[0];
    return p && { ...p, title: `СТОЛБ ${(sel.index ?? 0) + 1}`, kind: 'post', res: { uls: p.diagram, sls: p.diagram } };
  }
  return null;
}

const $ = (id) => document.getElementById(id);
const STORE_KEY = 'canopycraft.model.v2';

/** Расчёт из ссылки важнее сохранённого: по ссылке приходят делиться конкретным вариантом. */
function initialModel() {
  const h = typeof location !== 'undefined' ? location.hash : '';
  const fromLink = h && h.startsWith('#p=') ? decodeModel(h.slice(3)) : null;
  return fromLink ?? load() ?? defaultModel();
}

const state = {
  model: initialModel(),
  sel: { type: 'rafter', index: 0 },
  view: 'plan',
  result: null,
  meta: null,
};

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const m = JSON.parse(raw);
    return m && m.geom && m.wallPosts && m.wallPurlin && m.prices ? m : null;
  } catch { return null; }
}
function save() {
  if (drag) return; // во время перетаскивания сохраняем один раз, в конце
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.model)); } catch { /* приватный режим */ }
  syncUrl();
}

/** Адресная строка всегда показывает текущий расчёт — её можно скопировать в любой момент. */
let urlTimer = 0;
function syncUrl() {
  if (urlTimer) return;
  urlTimer = setTimeout(() => {
    urlTimer = 0;
    try {
      const code = encodeModel(state.model);
      const base = location.href.split('#')[0];
      history.replaceState(null, '', code ? `${base}#p=${code}` : base);
    } catch { /* внутри фрейма адресная строка недоступна — не беда */ }
  }, 400);
}

/** Ссылка на текущий расчёт. */
function shareUrl() {
  const code = encodeModel(state.model);
  return location.href.split('#')[0] + (code ? `#p=${code}` : '');
}

const getPath = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
function setPath(o, p, v) {
  const parts = p.split('.');
  const last = parts.pop();
  const t = parts.reduce((a, k) => a[k], o);
  t[last] = v;
}

function readVirtual(k) {
  if (k === '#rafterCount') return state.model.rafters.xs.length;
  if (k === '#postCount') return state.model.posts.xs.length;
  if (k === '#wallPostCount') return state.model.wallPosts.xs.length;
  return getPath(state.model, k);
}
function writeVirtual(k, v) {
  if (k === '#rafterCount') { state.model.rafters.xs = spread(state.model.geom.B, v); return; }
  if (k === '#postCount') { state.model.posts.xs = spread(state.model.geom.B, v); return; }
  if (k === '#wallPostCount') { state.model.wallPosts.xs = spread(state.model.geom.B, v); return; }
  setPath(state.model, k, v);
}

function buildParams() {
  const host = $('params');
  host.innerHTML = '';
  for (const c of CONTROLS) {
    if (c.group) {
      const t = document.createElement('div');
      t.className = 'pane-title';
      t.textContent = c.group;
      host.appendChild(t);
      continue;
    }
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const id = 'c_' + c.k.replace(/[.#]/g, '_');
    if (c.type === 'check') {
      wrap.innerHTML = `<label class="check" for="${id}"><input type="checkbox" id="${id}"><span>${c.label}</span></label>`;
    } else if (c.type === 'number') {
      wrap.innerHTML = `<label for="${id}">${c.label}</label><input type="number" id="${id}" min="${c.min ?? 0}" step="${c.step ?? 1}" inputmode="numeric">`;
    } else if (c.type === 'range') {
      const acts = (c.actions ?? []).map((a, i) => `<button class="btn" data-act="${c.k}:${i}" style="padding:0 6px;font-size:11px">${a[0]}</button>`).join(' ');
      wrap.innerHTML = `<label for="${id}">${c.label} <b data-val="${id}"></b></label><input type="range" id="${id}" min="${c.min}" max="${c.max}" step="${c.step}">${acts ? `<div style="display:flex;gap:5px;margin-top:3px">${acts}</div>` : ''}`;
    } else {
      const opts = c.options().map((o) => `<option value="${o.id}">${o.label}</option>`).join('');
      wrap.innerHTML = `<label for="${id}">${c.label}${c.pick ? ` <button class="btn" data-pick-el="${c.pick}" style="padding:0 6px;font-size:11px">подобрать</button>` : ''}</label><select id="${id}">${opts}</select>`;
    }
    host.appendChild(wrap);
    const input = wrap.querySelector('input,select');
    input.addEventListener('input', () => {
      let v = c.type === 'check' ? input.checked : input.value;
      if (c.type === 'range' || c.type === 'number' || c.numeric) v = Number(v) || 0;
      writeVirtual(c.k, v);
      if (c.k === 'geom.B') {
        state.model.rafters.xs = spread(state.model.geom.B, state.model.rafters.xs.length);
        state.model.posts.xs = spread(state.model.geom.B, state.model.posts.xs.length);
        state.model.wallPosts.xs = spread(state.model.geom.B, state.model.wallPosts.xs.length);
      }
      render();
    });
  }
  host.querySelectorAll('[data-act]').forEach((b) =>
    b.addEventListener('click', (e) => {
      e.preventDefault();
      const [key, i] = b.getAttribute('data-act').split(':');
      const ctrl = CONTROLS.find((c) => c.k === key);
      b.textContent = '…';
      setTimeout(() => {
        const msg = ctrl.actions[Number(i)][1](state.model);
        b.textContent = ctrl.actions[Number(i)][0];
        render(msg);
      }, 10);
    })
  );
  host.querySelectorAll('[data-pick-el]').forEach((b) =>
    b.addEventListener('click', (e) => {
      e.preventDefault();
      const key = b.getAttribute('data-pick-el');
      b.textContent = '…';
      setTimeout(() => {
        const r = key === 'rafters' && e.shiftKey ? null : pickSection(state.model, key, 0.9);
        if (r) { setPath(state.model, `${key}.sectionId`, r.id); }
        b.textContent = 'подобрать';
        render(r ? `Подобрано: ${r.label}, U = ${f2(r.U)}` : 'Подходящего сечения в сортаменте нет — уменьшите пролёт или шаг');
      }, 10);
    })
  );
}

function syncParams() {
  for (const c of CONTROLS) {
    if (c.group) continue;
    const id = 'c_' + c.k.replace(/[.#]/g, '_');
    const el = $(id);
    if (!el) continue;
    const v = readVirtual(c.k);
    if (c.type === 'check') el.checked = !!v;
    else el.value = String(v);
    const b = document.querySelector(`[data-val="${id}"]`);
    if (b) {
      let extra = '';
      if (c.k === '#rafterCount') extra = ` · шаг ${Math.round(state.model.geom.B / (v - 1))}`;
      if (c.k === '#postCount' || c.k === '#wallPostCount') extra = ` · пролёт ${Math.round(state.model.geom.B / (v - 1))}`;
      b.textContent = `${v} ${c.unit ?? ''}${extra}`;
    }
  }
}

function renderInspector(res) {
  const el = pickElement(res, state.sel);
  const host = $('inspector');
  if (!el) { host.innerHTML = ''; return; }
  const rows = [];
  rows.push(`<div class="pane-title">${el.title} · ${el.sec.label}</div>`);
  for (const c of el.checks) {
    rows.push(`<div class="chk">
      <span class="nm">${c.name}</span><span class="v" style="color:${uColor(c.U)}">${f2(c.U)}</span>
      <span class="bar"><span style="width:${Math.min(100, c.U * 100).toFixed(0)}%;background:${uColor(c.U)}"></span></span>
      <span class="fx">${c.formula}${c.note ? ' · ' + c.note : ''} → ${fmtVal(c)}</span>
    </div>`);
  }
  const worstName = el.worst?.name ?? '—';
  const v = !Number.isFinite(el.U)
    ? '<b>Расчёт не сошёлся.</b> Проверьте исходные данные — какой-то из параметров задан некорректно.'
    : el.U > 1 ? `<b>Не проходит.</b> Определяет «${worstName}» — ${f2(el.U)}.`
    : el.U > 0.85 ? `<b>На пределе.</b> Определяет «${worstName}» — ${f2(el.U)}.`
    : el.U < 0.4 ? '<b>Большой запас.</b> Можно уменьшить сечение или увеличить шаг.'
    : `<b>Проходит.</b> Определяет «${worstName}» — ${f2(el.U)}.`;
  rows.push(`<div class="verdict" style="border-color:${uColor(el.U)}">${v}</div>`);

  const kv = [];
  if (el.kind === 'rafter') {
    kv.push(['Грузовая ширина', `${Math.round(el.trib)} мм`]);
    kv.push(['Длина по скату', `${Math.round(el.Ls)} мм`]);
    kv.push(['M max', `${f2(Math.abs(el.Mmax) / 1e6)} кН·м`]);
    kv.push(['Q max', `${f2(Math.abs(el.Vmax) / 1000)} кН`]);
    kv.push(['N (скатная)', `${f2(el.N / 1000)} кН`]);
    for (const s of el.spans) kv.push([`Прогиб, ${s.kind}`, `${f2(s.f)} мм / ${f2(s.limitLength / 200)}`]);
    kv.push(['Реакция на стену', `${f2(el.reactions.wall / 1000)} кН`]);
    kv.push(['Реакция на прогон', `${f2(el.reactions.purlin / 1000)} кН`]);
  } else if (el.kind === 'post' || el.kind === 'wallPost') {
    kv.push(['N сжатие', `${f2(el.N / 1000)} кН`]);
    kv.push(['M', `${f2(el.M / 1e6)} кН·м`]);
    kv.push(['Отрыв', `${f2(Math.max(0, el.Nup) / 1000)} кН`]);
    kv.push(['Расчётная длина', `${Math.round(el.lef)} мм`]);
    if (el.bolts) {
      kv.push(['Горизонт. распор на столб', `${f2(el.Hpost / 1000)} кН`]);
      kv.push(['Шпилек', `${el.bolts.count} × М${res.model.wallPosts.boltDiameter}`]);
      kv.push(['На шпильку: растяжение', `${f2(el.bolts.Nbolt / 1000)} кН`]);
      kv.push(['На шпильку: срез', `${f2(el.bolts.Vbolt / 1000)} кН`]);
      kv.push(['По шпилькам снизу вверх', el.bolts.forces.map((f) => f2(f / 1000)).join(' / ') + ' кН']);
    }
  } else if (el.res?.uls) {
    kv.push(['M max', `${f2(Math.abs(el.res.uls.maxM) / 1e6)} кН·м`]);
    kv.push(['Q max', `${f2(Math.abs(el.res.uls.maxV) / 1000)} кН`]);
    const worstSpan = el.spans?.reduce((a, b) => (a.f > b.f ? a : b), { f: 0, limitLength: 1 });
    if (worstSpan) kv.push(['Прогиб', `${f2(worstSpan.f)} мм`]);
  }
  rows.push(kv.map(([a, b]) => `<div class="kv"><span>${a}</span><span>${b}</span></div>`).join(''));
  host.innerHTML = rows.join('');
}

/* ─────────────────── масштаб и панорама ─────────────────── */

const SVG_NS = 'http://www.w3.org/2000/svg';
const zoom = { plan: { k: 1, tx: 0, ty: 0 }, section: { k: 1, tx: 0, ty: 0 }, diagrams: { k: 1, tx: 0, ty: 0 } };
const zv = () => zoom[state.view];

function svgEl() { return $('canvas').querySelector('svg'); }

/** Размеры системы координат рисунка и его положение на экране. */
function frame() {
  const svg = svgEl();
  if (!svg) return null;
  const b = svg.viewBox.baseVal;
  return { svg, w: b.width, h: b.height, rect: svg.getBoundingClientRect() };
}

/**
 * Экранная точка → координаты SVG.
 * Через getScreenCTM, а не вручную через viewBox и ширину элемента: при
 * height 100 % включается центрирование по preserveAspectRatio, и ручной
 * пересчёт начинает врать.
 * @param {boolean} inner true — в системе координат самого рисунка,
 *   то есть уже с учётом масштаба и сдвига.
 */
function toSvg(clientX, clientY, inner = false) {
  const svg = svgEl();
  if (!svg) return { x: 0, y: 0 };
  const target = inner ? svg.querySelector('g[data-zoom]') || svg : svg;
  const ctm = target.getScreenCTM();
  if (!ctm) return { x: 0, y: 0 };
  const p = new DOMPoint(clientX, clientY).matrixTransform(ctm.inverse());
  return { x: p.x, y: p.y };
}

const toFrame = (clientX, clientY) => toSvg(clientX, clientY, false);

/**
 * Панорама свободная — всё клеточное поле рабочее. Ограничение мягкое:
 * не даём увести рисунок целиком из виду, кусок всегда остаётся на экране.
 */
function clampPan() {
  const f = frame();
  if (!f) return;
  const z = zv();
  const keep = 80; // сколько единиц рисунка обязано остаться видимым
  z.tx = Math.min(f.w - keep, Math.max(keep - z.k * f.w, z.tx));
  z.ty = Math.min(f.h - keep, Math.max(keep - z.k * f.h, z.ty));
}

/** Всё содержимое рисунка складывается в одну группу, её и двигаем. */
function wrapForZoom() {
  const svg = svgEl();
  if (!svg) return;
  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('data-zoom', '');
  while (svg.firstChild) g.appendChild(svg.firstChild);
  svg.appendChild(g);
  applyZoom();
}

function applyZoom() {
  const svg = svgEl();
  const g = svg && svg.querySelector('g[data-zoom]');
  const z = zv();
  if (g) g.setAttribute('transform', `translate(${z.tx.toFixed(2)} ${z.ty.toFixed(2)}) scale(${z.k.toFixed(4)})`);
  const out = $('zoom-val');
  if (out) out.textContent = `${Math.round(z.k * 100)} %`;
}

/** Масштабирование вокруг точки: она остаётся под курсором. */
function zoomAt(point, factor) {
  const z = zv();
  const k = Math.min(14, Math.max(1, z.k * factor));
  if (k === z.k) return;
  z.tx = point.x - (point.x - z.tx) * (k / z.k);
  z.ty = point.y - (point.y - z.ty) * (k / z.k);
  z.k = k;
  clampPan();
  applyZoom();
}

const canvasEl = $('canvas');
canvasEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomAt(toFrame(e.clientX, e.clientY), e.deltaY < 0 ? 1.18 : 1 / 1.18);
}, { passive: false });

let pan = null;
const pointers = new Map();
let pinch = null;

canvasEl.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { // щипок на сенсорном экране
    pan = null;
    const [a, b] = [...pointers.values()];
    pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y) };
    return;
  }
  if (e.target.closest && e.target.closest('[data-pick]')) return; // тянут элемент схемы
  pan = { x: e.clientX, y: e.clientY, tx: zv().tx, ty: zv().ty };
  canvasEl.setPointerCapture(e.pointerId);
});

canvasEl.addEventListener('pointermove', (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch.dist > 0) zoomAt(toFrame((a.x + b.x) / 2, (a.y + b.y) / 2), dist / pinch.dist);
    pinch.dist = dist;
    return;
  }
  if (!pan) return;
  const f = frame();
  if (!f) return;
  const z = zv();
  const scale = f.rect.width > 0 ? f.w / f.rect.width : 1; // единиц рисунка в пикселе
  z.tx = pan.tx + (e.clientX - pan.x) * scale;
  z.ty = pan.ty + (e.clientY - pan.y) * scale;
  clampPan();
  applyZoom();
});

const endPointer = (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) pan = null;
};
canvasEl.addEventListener('pointerup', endPointer);
canvasEl.addEventListener('pointercancel', endPointer);

$('zoom-in').addEventListener('click', () => { const f = frame(); if (f) zoomAt({ x: f.w / 2, y: f.h / 2 }, 1.4); });
$('zoom-out').addEventListener('click', () => { const f = frame(); if (f) zoomAt({ x: f.w / 2, y: f.h / 2 }, 1 / 1.4); });
$('zoom-reset').addEventListener('click', () => { const z = zv(); z.k = 1; z.tx = 0; z.ty = 0; applyZoom(); });

/** Массивы координат, которые можно таскать мышью. */
const ARRAY_OF = {
  rafter: (m) => m.rafters.xs,
  post: (m) => m.posts.xs,
  wallPost: (m) => m.wallPosts.xs,
};
const LABEL_OF = { rafter: 'Стропило', post: 'Столб', wallPost: 'Столб у стены' };
const MIN_GAP = 100; // мм — соседи не могут слипнуться или поменяться местами

/**
 * Состояние перетаскивания живёт вне разметки, а слушатели висят на window:
 * каждая перерисовка заменяет SVG целиком, вместе с элементом, который иначе
 * держал бы захват указателя — тогда перетаскивание обрывалось бы на первом шаге.
 */
let drag = null;
let dragFrame = 0;

function canvasToMm(clientX, clientY = 0) {
  const meta = state.meta;
  if (!meta) return 0;
  return (toSvg(clientX, clientY, true).x - meta.ox) / meta.sc;
}

function onDragMove(e) {
  if (!drag) return;
  e.preventDefault();
  drag.clientX = e.clientX;
  drag.fine = e.shiftKey;
  if (dragFrame) return; // кадры склеиваются, чтобы пересчёт не отставал от мыши
  dragFrame = requestAnimationFrame(() => {
    dragFrame = 0;
    if (!drag) return;
    const arr = ARRAY_OF[drag.type](state.model);
    const step = drag.fine ? 10 : 50;
    const x = Math.max(drag.lo, Math.min(drag.hi, Math.round(canvasToMm(drag.clientX) / step) * step));
    if (arr[drag.index] === x) return;
    arr[drag.index] = x;
    drag.moved = true;
    render(`${LABEL_OF[drag.type]} ${drag.index + 1} → ${Math.round(x)} мм`);
  });
}

function onDragEnd() {
  if (!drag) return;
  if (dragFrame) { cancelAnimationFrame(dragFrame); dragFrame = 0; }
  const moved = drag.moved;
  drag = null;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  window.removeEventListener('pointercancel', onDragEnd);
  if (moved) save();
  else render(); // простой клик — только подсветить выбранный элемент
}

function wirePlan() {
  const svg = $('canvas').querySelector('svg');
  svg.querySelectorAll('[data-pick]').forEach((g) => {
    g.addEventListener('pointerdown', (e) => {
      const type = g.getAttribute('data-pick');
      if (!ARRAY_OF[type]) { state.sel = { type }; render(); return; }
      const index = Number(g.getAttribute('data-index'));
      const arr = ARRAY_OF[type](state.model);
      state.sel = { type, index };
      drag = {
        type, index, moved: false, clientX: e.clientX, fine: e.shiftKey,
        lo: index > 0 ? arr[index - 1] + MIN_GAP : 0,
        hi: index < arr.length - 1 ? arr[index + 1] - MIN_GAP : state.model.geom.B,
      };
      window.addEventListener('pointermove', onDragMove);
      window.addEventListener('pointerup', onDragEnd);
      window.addEventListener('pointercancel', onDragEnd);
      e.preventDefault();
      renderInspector(state.result);
    });
  });
}

// двойной клик слушаем на контейнере, а не на SVG: SVG подменяется между кликами
$('canvas').addEventListener('dblclick', (e) => {
  if (state.view !== 'plan') return;
  const x = Math.max(0, Math.min(state.model.geom.B, Math.round(canvasToMm(e.clientX) / 50) * 50));
  state.model.rafters.xs.push(x);
  state.model.rafters.xs.sort((a, b) => a - b);
  state.sel = { type: 'rafter', index: state.model.rafters.xs.indexOf(x) };
  render(`Добавлено стропило на ${x} мм`);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (state.sel.type === 'rafter' && state.model.rafters.xs.length > 3) {
      state.model.rafters.xs.splice(state.sel.index, 1);
      state.sel.index = Math.max(0, state.sel.index - 1);
      render('Стропило удалено');
    } else if ((state.sel.type === 'post' || state.sel.type === 'wallPost')) {
      const arr = ARRAY_OF[state.sel.type](state.model);
      if (arr.length > 2) {
        arr.splice(state.sel.index, 1);
        state.sel.index = Math.max(0, state.sel.index - 1);
        render(`${LABEL_OF[state.sel.type]} удалён`);
      }
    }
  }
});

    (B2,5 → 1,0 МПа) — уточните по данным производителя блоков. Принято, что стеновые столбы опираются
    на собственное основание, а шпильки воспринимают только горизонтальные силы и отрыв; неравномерность
    между шпильками учтена коэффициентом 1,5 на верхнюю. Принято также, что плоскость кровли
    (обрешётка и крепление стропил к обвязке) передаёт горизонтальный распор на раскреплённый стеновой ряд;
    иначе наружные столбы нужно раскреплять раскосами.</p>
    <p>Результат — инженерная оценка, а не проект, прошедший экспертизу.</p>`;
}

/* ─────────────────── рендер ─────────────────── */

let hintText = 'Колесо или щипок — масштаб, тянуть фон — сдвиг · стропила и столбы тянутся мышью с шагом 50 мм, с Shift 10 мм · двойной клик — добавить стропило · Del — удалить';

function render(hint) {
  if (hint) hintText = hint;
  const res = analyse(state.model);
  state.result = res;
  const rows = { rafter: res.rafters, post: res.posts, wallPost: res.wallPosts }[state.sel.type];
  if (rows && state.sel.index >= rows.length) state.sel.index = rows.length - 1;
  syncParams();
  renderCanvas(res);
  renderInspector(res);
  renderSummary(res);
  renderBom(res);
  const pill = $('verdict-pill');
  pill.textContent = Number.isFinite(res.maxU)
    ? `макс U = ${f2(res.maxU)} · ${res.maxU > 1 ? 'не проходит' : res.maxU > 0.85 ? 'на пределе' : 'проходит'}`
    : 'расчёт не сошёлся — проверьте данные';
  pill.style.color = uColor(res.maxU);
  pill.style.borderColor = uColor(res.maxU);
  $('hint').textContent = hintText;
  save();
}

/* ─────────────────── события шапки ─────────────────── */

for (const [id, view] of [['tab-plan', 'plan'], ['tab-section', 'section'], ['tab-diagrams', 'diagrams']]) {
  $(id).addEventListener('click', () => {
    state.view = view;
    for (const t of ['tab-plan', 'tab-section', 'tab-diagrams']) $(t).setAttribute('aria-pressed', String(t === id));
    render();
  });
}
$('btn-pick-all').addEventListener('click', () => {
  $('btn-pick-all').textContent = 'Считаю…';
  setTimeout(() => {
    const sp = pickRafterSpacing(state.model, 0.9);
    if (sp) state.model.rafters.xs = spread(state.model.geom.B, sp.count);
    const out = pickAll(state.model, 0.9);
    state.model = out.model;
    $('btn-pick-all').textContent = 'Подобрать всё';
    render('Подобрано: ' + out.log.map((l) => `${l.label ?? '—'}`).join(' · ') + (sp ? ` · стропил ${sp.count} шт` : ''));
  }, 10);
});
$('btn-report').addEventListener('click', () => { buildReport(state.result); window.print(); });
$('btn-link').addEventListener('click', async () => {
  const url = shareUrl();
  try {
    await navigator.clipboard.writeText(url);
    render(`Ссылка на расчёт скопирована · ${url.length} символов`);
  } catch {
    window.prompt('Ссылка на расчёт:', url);
  }
});
$('btn-reset').addEventListener('click', () => {
  state.model = defaultModel();
  state.sel = { type: 'rafter', index: 0 };
  render('Сброшено к значениям по умолчанию');
});
// открыли ссылку на другой расчёт в той же вкладке
window.addEventListener('hashchange', () => {
  const h = location.hash;
  if (!h.startsWith('#p=')) return;
  if (h.slice(3) === encodeModel(state.model)) return;
  const m = decodeModel(h.slice(3));
  if (!m) return;
  state.model = m;
  render('Загружен расчёт из ссылки');
});

function selectWorst(res) {
  state.sel = selectRow(res, res.summary.reduce((a, b) => (a.U > b.U ? a : b)).key);
}

buildParams();
selectWorst(analyse(state.model));
render();

})();
</script>
</body>
</html>
