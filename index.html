<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CanopyCraft</title>
<meta name="description" content="Расчёт односкатного навеса, пристроенного к дому: стропила, обрешётка, прогоны, столбы. Сосна и профильная труба по СП 20, СП 64, СП 16. Карта загрузки, эпюры, массы и смета.">
<meta name="theme-color" content="#12405E">
<meta property="og:type" content="website">
<meta property="og:title" content="CanopyCraft — расчёт навеса">
<meta property="og:description" content="Карта загрузки, эпюры и подбор сечений для навеса у дома. Сосна и профильная труба.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F8FA; --sunk:#E4E9EE;
  --ink:#111820; --ink-2:#48545F; --ink-3:#7C8894;
  --rule:#D2DAE1; --rule-2:#BCC7D0;
  --accent:#12405E; --accent-2:#1D6791; --accent-soft:#E1EBF2;
  --u-low:#3D7EA6; --u-ok:#3E8E59; --u-warn:#C88A11; --u-bad:#BC382F;
  --grid:#CBD6DF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1418; --surface:#161C22; --surface-2:#1C242B; --sunk:#0B0F13;
    --ink:#E7ECF1; --ink-2:#A7B3BE; --ink-3:#74808B;
    --rule:#2A333C; --rule-2:#3A4650;
    --accent:#8CBEDE; --accent-2:#6FA9CD; --accent-soft:#17252F;
    --u-low:#6DA8CB; --u-ok:#5CB37A; --u-warn:#E0AA3D; --u-bad:#E06B60;
    --grid:#233039;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1418; --surface:#161C22; --surface-2:#1C242B; --sunk:#0B0F13;
  --ink:#E7ECF1; --ink-2:#A7B3BE; --ink-3:#74808B;
  --rule:#2A333C; --rule-2:#3A4650;
  --accent:#8CBEDE; --accent-2:#6FA9CD; --accent-soft:#17252F;
  --u-low:#6DA8CB; --u-ok:#5CB37A; --u-warn:#E0AA3D; --u-bad:#E06B60;
  --grid:#233039;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); margin:0;
  font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; font-size:14px; line-height:1.5;
}
.mono,input,select,button{font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
h1,h2,h3{font-family:Oswald,"IBM Plex Sans",sans-serif; font-weight:500; margin:0; letter-spacing:.02em}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px}

.shell{max-width:1400px; margin:0 auto; padding-block:14px 40px; padding-left:16px; padding-right:16px;
  display:flex; flex-direction:column; gap:12px}

/* ── шапка ── */
.topbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  border-bottom:2px solid var(--ink); padding-bottom:10px}
.brand{font-family:Oswald,sans-serif; font-size:19px; text-transform:uppercase; letter-spacing:.09em}
.brand small{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.14em; color:var(--ink-3); display:block; text-transform:none; letter-spacing:.1em}
.grow{flex:1}
.tabs{display:flex; border:1px solid var(--rule-2)}
.tabs button{font:inherit; font-size:12.5px; padding:4px 14px; background:transparent; border:0; color:var(--ink-2); cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent); color:var(--paper)}
.btn{font:inherit; font-size:12.5px; padding:5px 12px; background:var(--surface); color:var(--ink);
  border:1px solid var(--rule-2); cursor:pointer}
.btn:hover{border-color:var(--accent-2); color:var(--accent-2)}
.btn.primary{background:var(--accent); color:var(--paper); border-color:var(--accent)}
.btn.primary:hover{opacity:.9; color:var(--paper)}
.verdict-pill{font-family:"IBM Plex Mono",monospace; font-size:12px; padding:4px 10px; border:1px solid; white-space:nowrap}

/* ── три колонки ── */
.panes{display:grid; grid-template-columns:236px minmax(0,1fr) 260px; gap:0; align-items:start;
  border:1px solid var(--rule-2); background:var(--surface)}
.pane{padding:13px; min-width:0; overflow-wrap:anywhere}
.pane + .pane{border-left:1px solid var(--rule)}
.pane-title{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:9px}
.pane-title + .pane-title{margin-top:16px}

.field{display:flex; flex-direction:column; gap:2px; margin-bottom:8px}
.field label{font-size:11.5px; color:var(--ink-2); display:flex; justify-content:space-between; gap:8px}
.field label b{font-family:"IBM Plex Mono",monospace; font-weight:500; color:var(--ink)}
input[type=range]{width:100%; accent-color:var(--accent-2); height:16px; margin:0}
select,input[type=number]{font:inherit; font-size:12.5px; width:100%; padding:3px 5px;
  background:var(--surface-2); color:var(--ink); border:1px solid var(--rule-2)}
.check{display:flex; gap:7px; align-items:flex-start; font-size:12px; color:var(--ink-2); cursor:pointer; margin-bottom:6px}
.check input{margin-top:3px; accent-color:var(--accent-2)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}

/* ── сцена ── */
.stage{padding:0; display:flex; flex-direction:column; position:relative}
.zoombar{position:absolute; right:10px; top:10px; display:flex; gap:4px; align-items:center;
  background:var(--surface); border:1px solid var(--rule-2); padding:3px 5px; z-index:2}
.zoombar .btn{padding:0 9px; font-size:14px; line-height:1.5}
.zoomval{font-size:11px; color:var(--ink-3); min-width:46px; text-align:right}
.canvas{flex:0 0 auto; padding:10px; background:
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0/20px 20px,
  linear-gradient(90deg,var(--grid) 1px, transparent 1px) 0 0/20px 20px, var(--surface-2)}
/* SVG занимает весь контейнер: клеточное поле и есть рабочая зона чертежа */
.canvas svg{display:block; width:100%; height:100%; touch-action:none}
.canvas{cursor:grab; touch-action:none; overflow:hidden; height:min(72vh, 620px); min-height:380px}
.canvas:active{cursor:grabbing}
g.pickable, g.draggable{cursor:pointer}
.hint{font-size:11.5px; color:var(--ink-3); padding:7px 13px; border-top:1px solid var(--rule)}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; padding:7px 13px; border-top:1px solid var(--rule); font-size:11px; color:var(--ink-2)}
.legend i{display:inline-block; width:15px; height:8px; margin-right:5px; vertical-align:1px}
/* подписи и штриховка не должны перехватывать клики по элементам схемы */
.canvas svg text, .canvas svg polyline, .canvas svg polygon{pointer-events:none}
g.pickable{cursor:pointer}
g.pickable text{pointer-events:none}
g.draggable{cursor:ew-resize}

/* ── инспектор ── */
.chk{display:grid; grid-template-columns:1fr auto; gap:1px 8px; font-size:12px; align-items:baseline; margin-bottom:7px}
.chk .nm{color:var(--ink-2)}
.chk .v{font-family:"IBM Plex Mono",monospace; font-weight:500}
.chk .bar{grid-column:1/-1; height:5px; background:var(--sunk); position:relative; overflow:hidden}
.chk .bar span{position:absolute; left:0; top:0; bottom:0; display:block}
.chk .fx{grid-column:1/-1; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3); overflow-wrap:anywhere}
.verdict{margin:10px 0; padding:9px 10px; font-size:12px; border-left:3px solid; background:var(--surface-2)}
.kv{display:flex; justify-content:space-between; gap:10px; font-size:12px; border-bottom:1px dotted var(--rule); padding:2px 0}
.kv span:last-child{font-family:"IBM Plex Mono",monospace; text-align:right}
.kv span{overflow-wrap:anywhere; min-width:0}

/* ── сводка ── */
.summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px}
.card{border:1px solid var(--rule-2); background:var(--surface); padding:10px 12px; display:flex; flex-direction:column; gap:5px; cursor:pointer}
.card:hover{border-color:var(--accent-2)}
.card .t{font-family:Oswald,sans-serif; text-transform:uppercase; font-size:13px; letter-spacing:.05em}
.card .u{font-family:"IBM Plex Mono",monospace; font-size:22px; line-height:1}
.card .w{font-size:11.5px; color:var(--ink-2)}
.card .bar{height:5px; background:var(--sunk); position:relative; overflow:hidden}
.card .bar span{position:absolute; left:0; top:0; bottom:0}

.bom{border:1px solid var(--rule-2); background:var(--surface); padding:12px}
.tbl{overflow-x:auto}
.tbl table{min-width:540px}
table{border-collapse:collapse; width:100%; font-size:12.5px}
th,td{text-align:left; padding:4px 10px 4px 0; border-bottom:1px solid var(--rule)}
th{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
td.n{text-align:right; font-family:"IBM Plex Mono",monospace}
.foot{font-size:11.5px; color:var(--ink-3); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  border-top:1px solid var(--rule-2); padding-top:10px}

/* ── отчёт ── */
#report{display:none}
@media print{
  body{background:#fff}
  .shell > *:not(#report){display:none !important}
  #report{display:block; font-size:11pt; color:#000}
  #report h2{margin-top:14pt}
  #report table{font-size:9.5pt}
  #report th,#report td{border-bottom:1px solid #999}
}

@media (max-width:1000px){
  .panes{grid-template-columns:1fr}
  .pane + .pane{border-left:0; border-top:1px solid var(--rule)}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="brand">CanopyCraft<small>расчёт навеса у дома</small></div>
    <div class="tabs" role="group" aria-label="Вид">
      <button id="tab-plan" aria-pressed="true">План</button>
      <button id="tab-section" aria-pressed="false">Разрез</button>
      <button id="tab-diagrams" aria-pressed="false">Эпюры</button>
    </div>
    <span class="grow"></span>
    <span class="verdict-pill" id="verdict-pill">—</span>
    <button class="btn" id="btn-pick-all">Подобрать всё</button>
    <button class="btn" id="btn-report">Отчёт</button>
    <button class="btn" id="btn-link">Ссылка на расчёт</button>
    <button class="btn" id="btn-reset">Сбросить</button>
  </div>

  <div class="panes">
    <aside class="pane" id="params"></aside>
    <section class="pane stage">
      <div class="canvas" id="canvas"></div>
      <div class="zoombar">
        <button class="btn" id="zoom-out" title="Отдалить" aria-label="Отдалить">−</button>
        <button class="btn" id="zoom-in" title="Приблизить" aria-label="Приблизить">+</button>
        <button class="btn" id="zoom-reset" title="Вписать целиком">⌂</button>
        <span class="zoomval mono" id="zoom-val">100 %</span>
      </div>
      <div class="legend">
        <span><i style="background:var(--u-low)"></i>U &lt; 0,5 запас</span>
        <span><i style="background:var(--u-ok)"></i>0,5–0,85 норма</span>
        <span><i style="background:var(--u-warn)"></i>0,85–1,0 предел</span>
        <span><i style="background:var(--u-bad)"></i>U &gt; 1,0 не проходит</span>
      </div>
      <div class="hint" id="hint"></div>
    </section>
    <aside class="pane" id="inspector"></aside>
  </div>

  <div class="summary" id="summary"></div>
  <div class="bom" id="bom"></div>

  <div class="foot">
    <span>Инженерная оценка для частного строительства по СП 20.13330.2016, СП 64.13330.2017, СП 16.13330.2017. Не заменяет проект, прошедший экспертизу.</span>
    <span class="mono">v0.2</span>
  </div>

  <div id="report"></div>
</div>
<script>
(function(){
"use strict";
/* ── src/core/sections.js ── */
/**
 * Сортаменты сечений.
 *
 * Единицы всюду: мм, мм², мм⁴, мм³.
 *
 * Профильные трубы — ГОСТ 30245-2003 (гнутосварные) и ГОСТ 8645-68 для мелких.
 * Геометрические характеристики вычисляются с учётом скруглений углов
 * (R_нар = 2,0t при t ≤ 6 мм, иначе 2,5t), поэтому отличаются от табличных
 * значений ГОСТ примерно на 1 %, но всегда в безопасную сторону по сравнению
 * с наивной «разностью прямых прямоугольников» (та завышает I на 3–6 %).
 *
 * Пиломатериал — ГОСТ 24454-80, размеры при влажности 20 %.
 */

/** Площадь одного углового «серпика» между квадратом r×r и четвертью круга. */
const cornerArea = (r) => (1 - Math.PI / 4) * r * r;
/** Расстояние от угла до центра тяжести этого серпика. */
const cornerCentroid = (r) => (r * (10 - 3 * Math.PI)) / (12 - 3 * Math.PI);

/** Момент инерции прямоугольника со скруглёнными углами относительно своей оси. */
function roundedRectI(b, h, r) {
  if (r <= 0) return (b * h * h * h) / 12;
  const d = h / 2 - cornerCentroid(r);
  return (b * h * h * h) / 12 - 4 * cornerArea(r) * d * d;
}
function roundedRectA(b, h, r) {
  return b * h - 4 * cornerArea(r);
}

/**
 * Геометрические характеристики замкнутого гнутосварного профиля.
 * @param {number} h высота (в плоскости основного изгиба), мм
 * @param {number} b ширина, мм
 * @param {number} t толщина стенки, мм
 */
function rhsProps(h, b, t) {
  const Ro = t <= 6 ? 2.0 * t : 2.5 * t;
  const Ri = Math.max(0, Ro - t);
  const bi = b - 2 * t;
  const hi = h - 2 * t;
  const A = roundedRectA(b, h, Ro) - roundedRectA(bi, hi, Ri);
  const Ix = roundedRectI(b, h, Ro) - roundedRectI(bi, hi, Ri);
  const Iy = roundedRectI(h, b, Ro) - roundedRectI(hi, bi, Ri);
  return {
    A,
    Ix,
    Iy,
    Wx: Ix / (h / 2),
    Wy: Iy / (b / 2),
    ix: Math.sqrt(Ix / A),
    iy: Math.sqrt(Iy / A),
    /** сдвиговая площадь — две стенки */
    As: 2 * t * hi,
    /** статический момент полусечения (для касательных напряжений) */
    Sx: b * t * (h - t) / 2 + 2 * t * (hi / 2) * (hi / 4),
  };
}

/** Характеристики прямоугольного деревянного сечения. */
function rectProps(h, b) {
  const A = b * h;
  return {
    A,
    Ix: (b * h * h * h) / 12,
    Iy: (h * b * b * b) / 12,
    Wx: (b * h * h) / 6,
    Wy: (h * b * b) / 6,
    ix: h / Math.sqrt(12),
    iy: b / Math.sqrt(12),
    As: (5 / 6) * A,
    Sx: (b * h * h) / 8,
  };
}

const STEEL_SIZES = [
  // квадратные
  [40, 40, [2, 3]], [50, 50, [2, 3, 4]], [60, 60, [2, 3, 4, 5]],
  [80, 80, [3, 4, 5, 6]], [100, 100, [3, 4, 5, 6]], [120, 120, [4, 5, 6]],
  [140, 140, [4, 5, 6]], [150, 150, [4, 5, 6]], [160, 160, [5, 6]],
  [180, 180, [5, 6]], [200, 200, [6, 8]],
  // прямоугольные (первое число — высота, работает в плоскости изгиба)
  [50, 25, [2, 3]], [60, 30, [2, 3]], [60, 40, [2, 3]], [80, 40, [2, 3, 4]],
  [80, 60, [3, 4]], [100, 50, [3, 4, 5]], [100, 60, [3, 4, 5]], [100, 80, [3, 4, 5]],
  [120, 60, [3, 4, 5]], [120, 80, [4, 5, 6]], [140, 80, [4, 5, 6]],
  [140, 100, [4, 5, 6]], [160, 80, [4, 5, 6]], [160, 120, [5, 6]],
  [180, 100, [5, 6]], [200, 100, [5, 6, 8]], [200, 120, [6, 8]],
];

const TIMBER_SIZES = [
  [100, 25], [100, 32], [100, 40], [50, 50], [100, 50],
  [150, 40], [150, 50], [150, 100],
  [175, 50], [200, 40], [200, 50], [200, 60], [200, 75], [200, 100],
  [225, 50], [250, 50], [250, 60], [250, 75], [250, 100],
];

/** @typedef {{id:string,label:string,material:'timber'|'steel',h:number,b:number,t?:number,props:object,weight:number,massPerM:number}} Section */

/**
 * Плотность материалов, кг/м³.
 * Сосна при эксплуатационной влажности 12–20 % — 500; свежераспиленная
 * доска весит до 700–800 кг/м³, это стоит помнить при подъёме вручную.
 * Сталь — 7850.
 */
const DENSITY = { timber: 500, steel: 7850 };
const G = 9.80665; // м/с²

/** Погонная масса сечения, кг/м:  m = A·ρ,  A в м². */
function massPerMetre(A, material) {
  return A * 1e-6 * DENSITY[material];
}
/** Погонный вес, кН/м:  q = m·g. */
function selfWeight(A, material) {
  return (massPerMetre(A, material) * G) / 1000;
}

/** @type {Section[]} */
const SECTIONS = [];

for (const [h, b] of TIMBER_SIZES) {
  const props = rectProps(h, b);
  SECTIONS.push({
    id: `t${b}x${h}`,
    label: `${b}×${h}`,
    material: 'timber',
    h, b,
    props,
    weight: selfWeight(props.A, 'timber'),
    massPerM: massPerMetre(props.A, 'timber'),
  });
}
for (const [h, b, ts] of STEEL_SIZES) {
  for (const t of ts) {
    const props = rhsProps(h, b, t);
    SECTIONS.push({
      id: `s${b}x${h}x${t}`,
      label: `${b}×${h}×${t}`,
      material: 'steel',
      h, b, t,
      props,
      weight: selfWeight(props.A, 'steel'),
      massPerM: massPerMetre(props.A, 'steel'),
    });
  }
}

const BY_ID = new Map(SECTIONS.map((s) => [s.id, s]));

function section(id) {
  const s = BY_ID.get(id);
  if (!s) throw new Error(`Неизвестное сечение: ${id}`);
  return s;
}

/** Сечения одного материала, от самого дешёвого (по расходу материала) к дорогому. */
function ladder(material, opts = {}) {
  const { minH = 0, maxH = 1e9 } = opts;
  return SECTIONS
    .filter((s) => s.material === material && s.h >= minH && s.h <= maxH)
    .sort((a, b) => a.props.A - b.props.A || a.props.Wx - b.props.Wx);
}

/* ── src/core/materials.js ── */
/**
 * Материалы: расчётные сопротивления и коэффициенты условий работы.
 * Дерево — СП 64.13330.2017, сталь — СП 16.13330.2017.
 * Напряжения в МПа (Н/мм²), модули в МПа.
 */

/** Расчётные сопротивления сосны/ели, МПа. Табл. 3 СП 64.13330.2017. */
const TIMBER_GRADES = {
  1: { bendSmall: 14, bendMid: 15, bendWide: 16, tension: 10, shear: 1.8 },
  2: { bendSmall: 13, bendMid: 14, bendWide: 15, tension: 7, shear: 1.8 },
  3: { bendSmall: 8.5, bendMid: 10, bendWide: 11, tension: 0, shear: 1.6 },
};

/**
 * Коэффициент условий работы по влажности m_в, табл. 9 СП 64.13330.2017.
 * 1–2 — закрытые помещения и под навесом, 3 — открытый воздух, 4 — влажная среда.
 */
const SERVICE_CLASS_M = { 1: 1.0, 2: 1.0, 3: 0.9, 4: 0.85 };

const TIMBER_DEFAULTS = {
  grade: 2,
  serviceClass: 3, // навес — открытый воздух
  E: 10000,
  G: 500,
  Rcm90: 3.0, // местное смятие поперёк волокон
  density: 5.0, // кН/м³
};

/**
 * Расчётные характеристики деревянного элемента заданного сечения.
 * @param {{h:number,b:number}} sec
 * @param {{grade?:number,serviceClass?:number,mdl?:number}} opts
 */
function timberProps(sec, opts = {}) {
  const grade = opts.grade ?? TIMBER_DEFAULTS.grade;
  const cls = opts.serviceClass ?? TIMBER_DEFAULTS.serviceClass;
  const mdl = opts.mdl ?? 1.0; // 1,0 — сочетание с кратковременной (снег); 0,66 — только постоянная
  const g = TIMBER_GRADES[grade];
  // выбор строки таблицы 3 по ширине и высоте сечения
  let Rbase;
  if (sec.b > 130 && sec.h > 110 && sec.h <= 500) Rbase = g.bendWide;
  else if (sec.b > 110 && sec.h > 110 && sec.h <= 500) Rbase = g.bendMid;
  else Rbase = g.bendSmall;
  const mv = SERVICE_CLASS_M[cls];
  const k = mv * mdl;
  return {
    material: 'timber',
    Rbend: Rbase * k,
    Rcompr: Rbase * k,
    Rtens: g.tension * k,
    Rshear: g.shear * k,
    Rcm90: TIMBER_DEFAULTS.Rcm90 * mv,
    E: TIMBER_DEFAULTS.E,
    G: TIMBER_DEFAULTS.G,
    mv, mdl, grade,
    note: `сосна ${grade} сорт, m_в=${mv}, m_дл=${mdl}`,
  };
}

/** Стали для гнутосварных профилей. R_y, R_un — МПа. */
const STEELS = {
  C245: { Ry: 240, Run: 370, label: 'С245' },

const STEEL_DEFAULTS = { grade: 'C245', gammaC: 1.0, E: 206000, G: 79000, density: 78.5 };

function steelProps(opts = {}) {

  return {

/** Свойства материала по сечению и настройкам модели. */

}


/* ── src/core/loads.js ── */
/**
 * Нагрузки и их сочетания — СП 20.13330.2016.
 * Давления в кПа (кН/м²), длины в мм, углы в градусах.
 */

/**
 * НОРМАТИВНОЕ значение веса снегового покрова S_g, кПа. Табл. 10.1 СП 20.13330.2016.
 * Изменение № 2 перевело таблицу из расчётных значений в нормативные:
 * по п. 10.1 формула даёт нормативную нагрузку, а расчётная получается
 * умножением на γ_f = 1,4 (п. 10.12).
 */
const SNOW_REGIONS = { I: 0.5, II: 1.0, III: 1.5, IV: 2.0, V: 2.5, VI: 3.0, VII: 3.5, VIII: 4.0 };

/** Нормативное давление ветра w_0, кПа. Табл. 11.1. */
const WIND_REGIONS = { Ia: 0.17, I: 0.23, II: 0.30, III: 0.38, IV: 0.48, V: 0.60, VI: 0.73, VII: 0.85 };

/** k(z_e) — табл. 11.2. Типы местности: A открытая, B пригород/лес, C плотная застройка. */
const K_TABLE = {
  A: [[5, 0.75], [10, 1.0], [20, 1.25], [40, 1.5], [60, 1.7], [80, 1.85], [100, 2.0]],
  B: [[5, 0.5], [10, 0.65], [20, 0.85], [40, 1.1], [60, 1.3], [80, 1.45], [100, 1.6]],
  C: [[5, 0.4], [10, 0.4], [20, 0.55], [40, 0.8], [60, 1.0], [80, 1.15], [100, 1.25]],
};
/** ζ(z_e) — коэффициент пульсаций давления ветра, табл. 11.4. */
const ZETA_TABLE = {
  A: [[5, 0.85], [10, 0.76], [20, 0.69], [40, 0.62], [60, 0.58], [80, 0.56], [100, 0.54]],
  B: [[5, 1.22], [10, 1.06], [20, 0.92], [40, 0.80], [60, 0.75], [80, 0.71], [100, 0.68]],
  C: [[5, 1.78], [10, 1.78], [20, 1.50], [40, 1.26], [60, 1.14], [80, 1.06], [100, 1.0]],
};

function interp(table, z) {
  if (z <= table[0][0]) return table[0][1];
  for (let i = 1; i < table.length; i++) {
    if (z <= table[i][0]) {
      const [z0, v0] = table[i - 1], [z1, v1] = table[i];
      return v0 + ((v1 - v0) * (z - z0)) / (z1 - z0);
    }
  }
  return table[table.length - 1][1];
}

/** Кровельные покрытия: собственный вес по скату, кН/м², и предельный пролёт обрешётки, мм. */
const ROOFING = {
  pc6: { label: 'Поликарбонат сотовый 6 мм', g: 0.013, maxBatten: 600 },
  pc8: { label: 'Поликарбонат сотовый 8 мм', g: 0.015, maxBatten: 700 },
  pc10: { label: 'Поликарбонат сотовый 10 мм', g: 0.017, maxBatten: 900 },
  pcm4: { label: 'Поликарбонат монолитный 4 мм', g: 0.048, maxBatten: 700 },
  prof8: { label: 'Профлист С8–С21, 0,5 мм', g: 0.05, maxBatten: 800 },
  prof35: { label: 'Профлист НС35–Н60, 0,7 мм', g: 0.08, maxBatten: 1500 },
  metal: { label: 'Металлочерепица', g: 0.05, maxBatten: 350 },
  soft: { label: 'Мягкая черепица по OSB-9', g: 0.20, maxBatten: 250 },
};

/** μ для односкатного покрытия. Прил. Б.1 СП 20. */
function snowMu(alphaDeg) {
  if (alphaDeg <= 30) return 1.0;
  if (alphaDeg >= 60) return 0.0;
  return (60 - alphaDeg) / 30;
}

/**
 * Снеговой мешок у перепада высоты.
 * СП 20.13330.2016, приложение Б, схема Б.8 (рисунок Б.11, профиль «в» — навес).
 *
 *   (Б.5)  μ = 1 + (m₁·l′₁ + m₂·l′₂) / h
 *
 * Перечисление «в» — для пониженных покрытий шириной a < 21 м:
 *   m₂ = 0,5·k₁·k₂·k₃, но не менее 0,1
 *   k₁ = √(a/21);  k₂ = 1 − β/35 (при обратном уклоне k₂ = 1);  k₃ = 1 − φ/30, но не менее 0,3
 *
 * Перечисление «г» — длина зоны повышенных снегоотложений:
 *   при μ ≤ 2h/S₀ :  b = 2h, но не более 16 м
 *   при μ > 2h/S₀ :  (Б.6)  b = 2h · (μ − 1 + 2m₂) / (2h/S₀ − 1 + 2m₂),
 *                    но не более 5h и не более 16 м
 *
 * Перечисление «д» — потолок μ: 2h/S₀; 4 для покрытия здания при l′ ≤ 48 м;
 *   6 для навеса либо покрытия здания при l′ > 72 м, между 48 и 72 — интерполяция.
 *
 * Перечисление «е» — коэффициент μ₁ на дальнем конце зоны.
 *
 * Примечание 3 — при h < S₀/2 местную нагрузку у перепада не учитывают.
 * Примечание 4 — сплошной парапет высотой более 0,5·S₀ и более 1,2 м → m₁ = 0.
 *
 * @param {object} o
 * @param {number} o.h  перепад высоты, м; при h > 8 м принимается 8 м
 * @param {number} o.Sg нормативный вес снегового покрова S₀, кПа
 * @param {number} o.l1 длина верхнего покрытия, м (не более 100)
 * @param {number} o.l2 длина нижнего покрытия, м (не более 100 и не более 3a)
 * @param {number} o.a  ширина нижнего покрытия, м
 * @param {number} [o.beta] уклон нижнего покрытия вдоль переноса, град
 * @param {number} [o.phi] поперечный уклон нижнего покрытия, град
 * @param {boolean} [o.reverseSlope] обратный уклон (к перепаду) → k₂ = 1
 * @param {number} [o.m1] доля переноса с верхнего покрытия (0,4 при α ≤ 20°, иначе 0,3)
 * @param {boolean} [o.parapet] сплошной парапет у перепада → m₁ = 0
 * @param {boolean} [o.lowerIsCanopy] нижнее покрытие — навес
 */
function snowDrift(o) {
  const h = Math.min(8, Math.max(0, o.h));
  const Sg = o.Sg;
  const a = Math.max(0.1, o.a ?? 21);
  const l1 = Math.min(100, Math.max(0, o.l1 ?? 0));
  // длина переноса по нижнему покрытию без парапетов — не более утроенной ширины
  const l2 = Math.min(100, 3 * a, Math.max(0, o.l2 ?? 0));
  const m1 = o.parapet ? 0 : (o.m1 ?? 0.4);

  // перечисление «в»
  let m2 = o.m2 ?? 0.4;
  let m2parts = null;
  if (a < 21) {
    const k1 = Math.sqrt(a / 21);
    const k2 = o.reverseSlope ? 1 : Math.max(0, 1 - (o.beta ?? 0) / 35);
    const k3 = Math.max(0.3, 1 - (o.phi ?? 0) / 30);
    m2 = Math.max(0.1, 0.5 * k1 * k2 * k3);
    m2parts = { k1, k2, k3 };
  }

  const capGeom = (2 * h) / Sg;
  const capAbs = o.lowerIsCanopy === false ? capBuilding(l1, l2) : 6;
  const none = {
    applies: false, mu: 1, mu1: 1, raw: 1, capGeom, capAbs, governs: 'перепад мал (прим. 3)',
    length: 0, h, l1, l2, a, m1, m2, m2parts,
  };
  if (h <= 0 || h < Sg / 2) return none; // примечание 3

  const raw = 1 + (m1 * l1 + m2 * l2) / h;
  const mu = Math.max(1, Math.min(raw, capGeom, capAbs));

  // перечисление «г» и формула (Б.6)
  const spread = raw > capGeom;
  let b = 2 * h;
  if (spread) {
    const den = capGeom - 1 + 2 * m2;
    b = den > 1e-6 ? (2 * h * (raw - 1 + 2 * m2)) / den : 5 * h;
    b = Math.min(b, 5 * h);
  }
  b = Math.min(b, 16);

  // перечисление «е»
  let mu1;
  if (!o.parapet && (b >= l2 || raw <= capGeom)) mu1 = 1 - 2 * m2;
  else if (o.parapet && (b >= l2 || (l2 > b && raw <= capGeom))) {
    mu1 = l2 > b && raw <= capGeom ? 1 - (m2 * l2) / Math.max(1e-6, l2 - h) : 1 - 2 * m2;
  } else {
    mu1 = (l2 - 0.5 * mu * b) / Math.max(1e-6, l2 - 0.5 * b);
  }
  mu1 = Math.max(0.2, mu1);

  const governs =
    mu === capGeom && capGeom < raw ? 'ограничение μ ≤ 2h/S₀'
      : mu === capAbs && capAbs < raw ? `ограничение μ ≤ ${capAbs.toFixed(1)}`
        : 'формула (Б.5)';

  return { applies: true, mu, mu1, raw, capGeom, capAbs, governs, length: b * 1000, spread, h, l1, l2, a, m1, m2, m2parts };
}

/** Потолок μ для нижнего покрытия здания: 4 при l′ ≤ 48 м, 6 при l′ > 72 м, между — интерполяция. */
function capBuilding(l1, l2) {
  const l = Math.max(l1, l2);
  if (l <= 48) return 4;
  if (l > 72) return 6;
  return 4 + (2 * (l - 48)) / 24;
}

/**
 * Эпюра снега вдоль ската: функция горизонтальной координаты от стены (мм) → кПа.
 * Возвращает НОРМАТИВНОЕ значение (п. 10.1); расчётное = γ_f · нормативное, γ_f = 1,4.
 */
function snowProfile(site, alphaDeg, geom = {}) {
  const Sg = SNOW_REGIONS[site.snowRegion];
  const muRoof = snowMu(alphaDeg) * (site.ce ?? 1.0) * (site.ct ?? 1.0);
  const uniform = { id: 'uniform', label: 'равномерный', at: () => muRoof * Sg };

  const plain = (drift) => ({
    Sg, muWall: muRoof, driftLength: 0, drift,
    variants: [uniform], at: uniform.at,
  });
  if (!site.drift) return plain(null);

  const d = snowDrift({
    h: (geom.driftH ?? 0) / 1000,
    Sg,
    l1: (site.houseRoofLength ?? 6000) / 1000,
    l2: (geom.depth ?? 0) / 1000,
    a: (geom.width ?? 0) / 1000,
    beta: geom.alpha ?? 0,
    phi: site.crossSlope ?? 0,
    reverseSlope: !!site.reverseSlope,
    m1: (site.houseRoofSlope ?? 20) > 20 ? 0.3 : 0.4,
    parapet: !!site.parapet,
    lowerIsCanopy: true,
  });
  if (!d.applies) return plain(d);

  // схема Б.8: нижнее покрытие считают в двух вариантах — равномерном
  // и с мешком; за расчётный принимается худший для каждого элемента
  const bag = {
    id: 'bag',
    label: 'снеговой мешок',
    at(y) {
      const k = Math.min(1, Math.max(0, y) / d.length);
      return (d.mu - (d.mu - d.mu1) * k) * Sg;
    },
  };
  return { Sg, muWall: d.mu, muEnd: d.mu1, driftLength: d.length, drift: d, variants: [uniform, bag], at: bag.at };
}

/**
 * Ветровое давление на уровне кровли навеса.
 * w = w_0 · k(z_e) · c · (1 + ζ·ν)  — п. 11.1.
 * @returns {{up:number, down:number, lateral:number, wm:number}} кПа, расчётные значения
 */
function windPressure(site, zMm) {
  const w0 = WIND_REGIONS[site.windRegion];
  const z = Math.max(2, zMm / 1000);
  const k = interp(K_TABLE[site.terrain] ?? K_TABLE.B, z);
  const zeta = interp(ZETA_TABLE[site.terrain] ?? ZETA_TABLE.B, z);
  const nu = 0.95; // коэффициент пространственной корреляции для малых сооружений
  const dyn = 1 + zeta * nu;
  const wm = w0 * k;
  const gammaF = 1.4;
  const cUp = site.cUp ?? 1.4; // отсос сверху
  const cUnder = site.cUnder ?? 0.8; // поддув снизу
  const cDown = site.cDown ?? 0.5; // прижимающая составляющая при другом направлении
  return {
    wm,
    dyn,
    up: w0 * k * dyn * (cUp + cUnder) * gammaF,
    down: w0 * k * dyn * cDown * gammaF,
    lateral: w0 * k * dyn * 1.4 * gammaF, // на боковую проекцию столба/фризовой доски
  };
}

/** Коэффициенты надёжности по нагрузке, табл. 7.1 СП 20. */
const GAMMA_F = {
  snow: 1.4, // п. 10.12 СП 20
  wind: 1.4, // разд. 11 СП 20
  steel: 1.05,
  timber: 1.1,
  roofing: 1.2,
  relieving: 0.9, // постоянная, когда она разгружает (проверка на отрыв)
};

/**
 * Сочетания нагрузок. Каждое возвращает множители для составляющих.
 * ULS — по прочности и устойчивости, SLS — по прогибам (нормативные нагрузки).
 */
const COMBOS = [
  { id: 'ULS-1', label: 'G + снег', kind: 'uls', dead: null, snow: 1.0, wind: 0 },
  { id: 'ULS-2', label: 'G + снег + 0,9·ветер↓', kind: 'uls', dead: null, snow: 1.0, wind: 0.9 },
  { id: 'ULS-3', label: '0,9·G − ветер↑ (отрыв)', kind: 'uplift', dead: GAMMA_F.relieving, snow: 0, wind: -1.0 },
  { id: 'SLS', label: 'G_н + S_н (прогибы)', kind: 'sls', dead: 1.0, snow: 0.7, wind: 0 },
];

/* ── src/core/beam.js ── */
/**
 * Балочный решатель: МКЭ, элемент Тимошенко (учитывает сдвиговые деформации).
 *
 * Система координат: x вдоль оси балки, прогиб v и нагрузки — положительные вниз.
 * Единицы: мм, Н, Н/мм, МПа, мм⁴.
 *
 * Опоры — шарнирные (v = 0), число и положение произвольные, консоли с любой стороны.
 * Эпюры M и Q считаются статикой по найденным реакциям, а не по узловым усилиям МКЭ,
 * поэтому не зависят от густоты сетки.
 */

/** Симметричная ленточная матрица: хранится верхняя лента. */
function bandedSolve(n, bw, band, f) {
  const A = band;
  const idx = (i, j) => i * (bw + 1) + (j - i);
  // LDL^T
  for (let i = 0; i < n; i++) {
    for (let j = i; j <= Math.min(i + bw, n - 1); j++) {
      let s = A[idx(i, j)];
      for (let k = Math.max(0, i - bw, j - bw); k < i; k++) {
        s -= A[idx(k, i)] * A[idx(k, j)] * A[idx(k, k)];
      }
      if (i === j) A[idx(i, i)] = s;
      else A[idx(i, j)] = s / A[idx(i, i)];
    }
  }
  const y = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    let s = f[i];
    for (let k = Math.max(0, i - bw); k < i; k++) s -= A[idx(k, i)] * A[idx(k, k)] * y[k];
    y[i] = s / A[idx(i, i)];
  }
  const u = new Float64Array(n);
  for (let i = n - 1; i >= 0; i--) {
    let s = y[i];
    for (let k = i + 1; k <= Math.min(i + bw, n - 1); k++) s -= A[idx(i, k)] * u[k];
    u[i] = s;
  }
  return u;
}

function elementStiffness(Le, EI, GAs) {
  const phi = GAs > 0 ? (12 * EI) / (GAs * Le * Le) : 0;
  const c = EI / (Le * Le * Le * (1 + phi));
  const L = Le;
  return [
    [12 * c, 6 * L * c, -12 * c, 6 * L * c],
    [6 * L * c, (4 + phi) * L * L * c, -6 * L * c, (2 - phi) * L * L * c],
    [-12 * c, -6 * L * c, 12 * c, -6 * L * c],
    [6 * L * c, (2 - phi) * L * L * c, -6 * L * c, (4 + phi) * L * L * c],
  ];
}

/**
 * @param {object} o
 * @param {number} o.length длина балки, мм
 * @param {number[]} o.supports координаты шарнирных опор, мм
 * @param {number} o.EI жёсткость на изгиб, Н·мм²
 * @param {number} o.GAs сдвиговая жёсткость, Н (0 — не учитывать сдвиг)
 * @param {(x:number)=>number} [o.q] распределённая нагрузка, Н/мм, вниз
 * @param {{x:number,P:number}[]} [o.point] сосредоточенные силы, Н, вниз
 * @param {{x:number,M:number}[]} [o.moments] сосредоточенные моменты, Н·мм
 * @param {number} [o.nEl] минимальное число конечных элементов
 */
function solveBeam(o) {
  const { length, EI, GAs = 0 } = o;
  const q = o.q ?? (() => 0);
  const point = o.point ?? [];
  const moments = o.moments ?? [];
  const nEl = o.nEl ?? 120;

  // --- сетка: равномерная плюс узлы в опорах и под силами
  const set = new Set([0, length]);
  for (let i = 1; i < nEl; i++) set.add((length * i) / nEl);
  for (const s of o.supports) set.add(Math.min(length, Math.max(0, s)));
  for (const p of point) set.add(Math.min(length, Math.max(0, p.x)));
  for (const p of moments) set.add(Math.min(length, Math.max(0, p.x)));
  const X = [...set].sort((a, b) => a - b).filter((v, i, a) => i === 0 || v - a[i - 1] > 1e-6);
  const nn = X.length;
  const ndof = 2 * nn;
  const bw = 3;

  const band = new Float64Array(ndof * (bw + 1));
  const F = new Float64Array(ndof);
  const idx = (i, j) => i * (bw + 1) + (j - i);
  const elems = [];

  for (let e = 0; e < nn - 1; e++) {
    const Le = X[e + 1] - X[e];
    const k = elementStiffness(Le, EI, GAs);
    const dofs = [2 * e, 2 * e + 1, 2 * e + 2, 2 * e + 3];
    elems.push({ k, dofs, Le, x0: X[e] });
    for (let a = 0; a < 4; a++) {
      for (let b = a; b < 4; b++) {
        const i = dofs[a], j = dofs[b];
        const [lo, hi] = i <= j ? [i, j] : [j, i];
        band[idx(lo, hi)] += k[a][b];
      }
    }
    // распределённая нагрузка: интегрируем q по элементу (3 точки Симпсона)
    const wm = (q(X[e]) + 4 * q(X[e] + Le / 2) + q(X[e + 1])) / 6;
    F[dofs[0]] += (wm * Le) / 2;
    F[dofs[1]] += (wm * Le * Le) / 12;
    F[dofs[2]] += (wm * Le) / 2;
    F[dofs[3]] -= (wm * Le * Le) / 12;
  }
  const Fload = Float64Array.from(F);
  for (const p of point) {
    let n = 0;
    for (let i = 0; i < nn; i++) if (Math.abs(X[i] - p.x) < Math.abs(X[n] - p.x)) n = i;
    F[2 * n] += p.P;
    Fload[2 * n] += p.P;
  }

  // --- закрепления: v = 0
  for (const p of moments) {
    let n = 0;
    for (let i = 0; i < nn; i++) if (Math.abs(X[i] - p.x) < Math.abs(X[n] - p.x)) n = i;
    F[2 * n + 1] += p.M;
    Fload[2 * n + 1] += p.M;
  }

  const fixed = [];
  for (const s of o.supports) {
    let n = 0;
    for (let i = 0; i < nn; i++) if (Math.abs(X[i] - s) < Math.abs(X[n] - s)) n = i;
    fixed.push({ node: n, dof: 2 * n, x: X[n] });
  }
  for (const fx of fixed) {
    const d = fx.dof;
    for (let j = Math.max(0, d - bw); j <= Math.min(ndof - 1, d + bw); j++) {
      if (j < d) band[idx(j, d)] = 0;
      else if (j > d) band[idx(d, j)] = 0;
    }
    band[idx(d, d)] = 1;
    F[d] = 0;
  }

  const u = bandedSolve(ndof, bw, band, F);

  // --- реакции
  const KU = new Float64Array(ndof);
  for (const el of elems) {
    for (let a = 0; a < 4; a++) {
      let s = 0;
      for (let b = 0; b < 4; b++) s += el.k[a][b] * u[el.dofs[b]];
      KU[el.dofs[a]] += s;
    }
  }
  // R > 0 — усилие, которое балка передаёт на опору (реакция направлена вверх)
  const reactions = fixed.map((fx) => ({ x: fx.x, R: Fload[fx.dof] - KU[fx.dof] }));

  // --- эпюры статикой
  const nSample = 401;
  const xs = new Float64Array(nSample);
  const V = new Float64Array(nSample);
  const M = new Float64Array(nSample);
  const dx = length / (nSample - 1);
  // I0 = ∫q dt, I1 = ∫q·t dt — момент считается точной статикой,
  // а не интегрированием эпюры Q (иначе скачки в опорах дают ошибку ~ΔR·dx/2)
  let I0 = 0, I1 = 0;
  for (let i = 0; i < nSample; i++) {
    const x = i * dx;
    xs[i] = x;
    if (i > 0) {
      const xa = x - dx, xm = xa + dx / 2;
      I0 += ((q(xa) + 4 * q(xm) + q(x)) / 6) * dx;
      I1 += ((q(xa) * xa + 4 * q(xm) * xm + q(x) * x) / 6) * dx;
    }
    let v = -I0;
    let m = -(x * I0 - I1);
    for (const r of reactions) if (r.x <= x + 1e-9) { v += r.R; m += r.R * (x - r.x); }
    for (const p of point) if (p.x <= x + 1e-9) { v -= p.P; m -= p.P * (x - p.x); }
    for (const p of moments) if (p.x <= x + 1e-9) m += p.M;
    V[i] = v;
    M[i] = m;
  }

  // --- прогибы: интерполяция узловых значений на ту же сетку
  const w = new Float64Array(nSample);
  let n0 = 0;
  for (let i = 0; i < nSample; i++) {
    const x = xs[i];
    while (n0 < nn - 2 && X[n0 + 1] < x) n0++;
    const xa = X[n0], xb = X[n0 + 1];
    const t = (x - xa) / (xb - xa);
    const va = u[2 * n0], ta = u[2 * n0 + 1], vb = u[2 * n0 + 2], tb = u[2 * n0 + 3];
    const Le = xb - xa;
    const h00 = 2 * t ** 3 - 3 * t ** 2 + 1, h10 = t ** 3 - 2 * t ** 2 + t;
    const h01 = -2 * t ** 3 + 3 * t ** 2, h11 = t ** 3 - t ** 2;
    w[i] = h00 * va + h10 * Le * ta + h01 * vb + h11 * Le * tb;
  }

  let maxM = 0, maxV = 0;
  for (let i = 0; i < nSample; i++) {
    if (Math.abs(M[i]) > Math.abs(maxM)) maxM = M[i];
    if (Math.abs(V[i]) > Math.abs(maxV)) maxV = V[i];
  }

  return { x: xs, V, M, w, reactions, maxM, maxV, nodes: X, u };
}

/**
 * Максимальные прогибы по участкам: между соседними опорами и на консолях.
 * @returns {{spans:{x0:number,x1:number,f:number,limitLength:number}[]}}
 */
function deflectionSpans(res, length, supports) {
  const sup = [...supports].sort((a, b) => a - b);
  const spans = [];
  const pick = (x0, x1) => {
    let f = 0;
    for (let i = 0; i < res.x.length; i++) {
      const x = res.x[i];
      if (x < x0 - 1e-6 || x > x1 + 1e-6) continue;
      if (Math.abs(res.w[i]) > Math.abs(f)) f = res.w[i];
    }
    return f;
  };
  if (sup.length && sup[0] > 1) spans.push({ kind: 'консоль', x0: 0, x1: sup[0], f: Math.abs(pick(0, sup[0])), limitLength: 2 * sup[0] });
  for (let i = 0; i + 1 < sup.length; i++) {
    spans.push({ kind: 'пролёт', x0: sup[i], x1: sup[i + 1], f: Math.abs(pick(sup[i], sup[i + 1])), limitLength: sup[i + 1] - sup[i] });
  }
  const last = sup[sup.length - 1];
  if (last !== undefined && length - last > 1) {
    spans.push({ kind: 'консоль', x0: last, x1: length, f: Math.abs(pick(last, length)), limitLength: 2 * (length - last) });
  }
  return { spans };
}

/* ── src/core/checks.js ── */
/**
 * Проверки несущей способности.
 * Дерево — СП 64.13330.2017, сталь — СП 16.13330.2017.
 *
 * Каждая проверка возвращает единый объект:
 *   { name, value, limit, unit, U, formula, note }
 * где U = value / limit — коэффициент использования.
 */

const chk = (name, value, limit, unit, formula, note) => ({
  name,
  value,
  limit,
  unit,
  U: limit > 0 ? value / limit : 0,
  formula,
  note,
});

/* ─────────────────────────── ДЕРЕВО ─────────────────────────── */

function timberBending(M, W, mat) {
  return chk('Изгиб', Math.abs(M) / W, mat.Rbend, 'МПа', 'σ = M / W ≤ R_и·m_в·m_дл');
}

function timberShear(V, sec, mat) {
  const tau = (1.5 * Math.abs(V)) / (sec.b * sec.h);
  return chk('Скалывание', tau, mat.Rshear, 'МПа', 'τ = 1,5·Q/(b·h) ≤ R_ск');
}

/**
 * Сжатие с изгибом, п. 7.17 СП 64: N/(A·R_с) + M_д/(W·R_и) ≤ 1,
 * где M_д = M/ξ, ξ = 1 − λ²·N/(3000·A·R_с).
 */
function timberCombined(N, M, sec, mat, lambda) {
  const A = sec.b * sec.h;
  const W = (sec.b * sec.h * sec.h) / 6;
  const Rc = mat.Rcompr;
  let xi = 1 - (lambda * lambda * Math.abs(N)) / (3000 * A * Rc);
  if (xi < 0.05) xi = 0.05;
  const Md = Math.abs(M) / xi;
  const value = Math.abs(N) / (A * Rc) + Md / (W * mat.Rbend);
  return chk('Сжатие с изгибом', value, 1.0, '', 'N/(A·R_с) + M_д/(W·R_и) ≤ 1',
    `ξ = ${xi.toFixed(3)}, λ = ${lambda.toFixed(0)}`);
}

/**
 * Устойчивость плоской формы деформирования, п. 7.4.2 СП 64:
 * σ ≤ φ_м·R_и, φ_м = 140·b²·k_ф/(l_р·h).
 * l_р — расстояние между закреплениями СЖАТОЙ кромки.
 */
function timberLateral(M, sec, mat, lr, kf = 1.75) {
  if (lr <= 0) return null;
  const W = (sec.b * sec.h * sec.h) / 6;
  const phiM = Math.min(1, (140 * sec.b * sec.b * kf) / (lr * sec.h));
  return chk('Устойчивость плоской формы', Math.abs(M) / W, phiM * mat.Rbend, 'МПа',
    'σ ≤ φ_м·R_и,  φ_м = 140·b²·k_ф/(l_р·h)',
    `φ_м = ${phiM.toFixed(2)}, l_р = ${Math.round(lr)} мм`);
}

/** Смятие поперёк волокон на опоре. */
function timberBearing(R, sec, mat, supportLength) {
  const value = Math.abs(R) / (sec.b * supportLength);
  return chk('Смятие на опоре', value, mat.Rcm90, 'МПа', 'σ_см = R/(b·l_оп) ≤ R_см,90',
    `площадка ${supportLength} мм`);
}

/* ─────────────────────────── СТАЛЬ ─────────────────────────── */

function steelBending(M, W, mat, c1 = 1.0) {
  return chk('Изгиб', Math.abs(M) / (c1 * W), mat.Ry * mat.gammaC, 'МПа',
    'M/W_n,min ≤ R_y·γ_c');
}

/** τ = Q·S/(I·t_w) при t_w = 2t; для замкнутого профиля равносильно Q/A_стенок. */
function steelShear(V, props, mat) {
  const tau = Math.abs(V) / props.As;
  return chk('Срез', tau, mat.Rs * mat.gammaC, 'МПа', 'τ = Q/A_стенок ≤ R_s·γ_c');
}

/**
 * Коэффициент устойчивости при центральном сжатии, п. 7.1.3 СП 16.
 * Тип кривой «b» (гнутосварные замкнутые профили): α = 0,04, β = 0,09.
 */
function phiBuckling(lambda, Ry, E = 206000, curve = 'b') {
  const AB = { a: [0.03, 0.06], b: [0.04, 0.09], c: [0.04, 0.14] }[curve];
  const lb = lambda * Math.sqrt(Ry / E);
  if (lb <= 0.4) return { phi: 1, lb };
  if (lb > 3.8) return { phi: 332 / (lb * lb * (51 - lb)), lb };
  const delta = 9.87 * (1 - AB[0] + AB[1] * lb) + lb * lb;
  const phi = (0.5 * (delta - Math.sqrt(delta * delta - 39.48 * lb * lb))) / (lb * lb);
  return { phi: Math.min(1, phi), lb };
}

/** Устойчивость центрально-сжатого стержня. */
function steelStability(N, props, mat, lef, axis = 'y') {
  const i = axis === 'y' ? props.iy : props.ix;
  const lambda = lef / i;
  const { phi, lb } = phiBuckling(lambda, mat.Ry, mat.E);
  const c = chk('Устойчивость столба', Math.abs(N), phi * props.A * mat.Ry * mat.gammaC, 'Н',
    'N ≤ φ·A·R_y·γ_c', `λ = ${lambda.toFixed(0)}, λ̄ = ${lb.toFixed(2)}, φ = ${phi.toFixed(3)}`);
  c.lambda = lambda;
  c.phi = phi;
  c.lb = lb;
  return c;
}

/**
 * Сжатие с изгибом. Вместо таблицы φ_e (прил. Д.3 СП 16) используется
 * взаимодействие с усилением момента по деформированной схеме —
 * результат заведомо не менее консервативен, чем по φ_e.
 */
function steelBeamColumn(N, M, props, mat, lef, axis = 'x') {
  const i = axis === 'x' ? props.ix : props.iy;
  const I = axis === 'x' ? props.Ix : props.Iy;
  const W = axis === 'x' ? props.Wx : props.Wy;
  const lambda = lef / i;
  const { phi } = phiBuckling(lambda, mat.Ry, mat.E);
  const Ncr = (Math.PI * Math.PI * mat.E * I) / (lef * lef);
  const amp = 1 / Math.max(0.2, 1 - Math.abs(N) / Ncr);
  const Rd = mat.Ry * mat.gammaC;
  const value = Math.abs(N) / (phi * props.A * Rd) + (Math.abs(M) * amp) / (W * Rd);
  const c = chk('Сжатие с изгибом', value, 1.0, '',
    'N/(φ·A·R_y·γ_c) + M·η/(W·R_y·γ_c) ≤ 1',
    `φ = ${phi.toFixed(3)}, η = ${amp.toFixed(2)}, N_cr = ${(Ncr / 1000).toFixed(0)} кН`);
  c.phi = phi;
  c.lambda = lambda;
  return c;
}

/** Предельная гибкость сжатого элемента: λ_u = 180 − 60α. */
function steelSlenderness(lambda, alpha) {
  const a = Math.min(1, Math.max(0.5, alpha));
  return chk('Гибкость', lambda, 180 - 60 * a, '', 'λ ≤ 180 − 60·α', `α = ${a.toFixed(2)}`);
}

/** Местная устойчивость стенки замкнутого профиля, табл. 9 СП 16. */
function steelLocalBuckling(sec, mat, lb = 0) {
  const bef = sec.h - 2 * (sec.t ?? 0);
  const t = sec.t ?? 1;
  const limit = Math.min(1.9, 1.2 + 0.35 * lb) * Math.sqrt(mat.E / mat.Ry);
  return chk('Местная устойчивость стенки', bef / t, limit, '',
    'b_ef/t ≤ (1,2 + 0,35·λ̄)·√(E/R_y)');
}

/* ─────────────────────── ОБЩИЕ ─────────────────────── */

/**
 * Прогибы. Предельные значения — табл. 19 СП 64 и прил. Д СП 20.
 * @param {{kind:string,f:number,limitLength:number}[]} spans
 * @param {number} ratio знаменатель: 200 для стропил и прогонов, 150 для обрешётки
 */
function deflectionCheck(spans, ratio) {
  let worst = null;
  for (const s of spans) {
    const limit = s.limitLength / ratio;
    const c = chk('Прогиб', s.f, limit, 'мм', `f ≤ l/${ratio}`,
      `${s.kind} ${Math.round(s.x1 - s.x0)} мм${s.kind === 'консоль' ? ' (расчётная длина 2a)' : ''}`);
    if (!worst || c.U > worst.U) worst = c;
  }
  return worst;
}

/**
 * Худшая проверка из набора и общий коэффициент использования.
 * Нечисловой U (испорченные исходные данные) считается бесконечным:
 * такой результат должен бросаться в глаза, а не прятаться за нулём.
 */
function worstOf(checks) {
  const list = checks.filter(Boolean);
  let worst = null;
  let U = 0;
  for (const c of list) {
    const u = Number.isFinite(c.U) ? c.U : Infinity;
    if (worst === null || u > U) { worst = c; U = u; }
  }
  return { checks: list, U, worst };
}

/* ───────────── КРЕПЛЕНИЕ К ГАЗОБЕТОННОЙ СТЕНЕ ───────────── */

/**
 * Расчётное сопротивление сжатию кладки из ячеистобетонных блоков на клею, МПа.
 * Ориентир по СП 15.13330; уточняется по данным производителя блоков.
 */
const AERATED_R = { 'B2.0': 0.85, 'B2.5': 1.0, 'B3.5': 1.3, 'B5.0': 1.7 };

/** Смятие газоблока под шайбой сквозной шпильки (растяжение от стены). */
function boltPlateBearing(N, plateSize, boltD, blockClass) {
  const R = AERATED_R[blockClass] ?? 1.0;
  const area = plateSize * plateSize - (Math.PI * boltD * boltD) / 4;
  return chk('Смятие газоблока под шайбой', Math.abs(N) / area, R * 1.2, 'МПа',
    'σ = N/A_шайбы ≤ 1,2·R_кладки',
    `шайба ${plateSize}×${plateSize} мм, блок ${blockClass} → R = ${R} МПа`);
}

/** Смятие газоблока стенкой отверстия от поперечной силы на шпильку. */
function boltHoleBearing(V, boltD, wallThickness, blockClass) {
  const R = AERATED_R[blockClass] ?? 1.0;
  return chk('Смятие газоблока в отверстии', Math.abs(V) / (boltD * wallThickness), R * 1.2, 'МПа',
    'σ = Q/(d·t_стены) ≤ 1,2·R_кладки',
    `М${boltD} через стену ${wallThickness} мм`);
}

/** Срез шпильки. R_bs = 0,4·R_bun (СП 16, табл. Д.5): класс 5.8 → 200 МПа, 8.8 → 320 МПа. */
function boltShear(V, boltD, grade = '5.8', planes = 1) {
  const Rbs = { '4.8': 160, '5.8': 200, '8.8': 320 }[grade] ?? 200;
  const As = { 10: 58, 12: 84.3, 16: 157, 20: 245, 24: 353 }[boltD] ?? (Math.PI * boltD * boltD) / 4 * 0.78;
  return chk('Срез шпильки', Math.abs(V) / (As * planes), Rbs, 'МПа',
    'τ = Q/A_ш ≤ R_bs', `М${boltD} класса ${grade}, A_нетто = ${As} мм²`);
}

/** Равномерно распределить n элементов по ширине B. */
function spread(B, n) {
  return Array.from({ length: n }, (_, i) => (B * i) / (n - 1));
}

/** Грузовые ширины: половина расстояния до соседей слева и справа. */
function tributaries(xs, B) {
  const s = [...xs].sort((p, q) => p - q);
  return s.map((x, i) => {
    const left = i === 0 ? 0 : (x - s[i - 1]) / 2;
    const right = i === s.length - 1 ? 0 : (s[i + 1] - x) / 2;
    const edgeLeft = i === 0 ? Math.max(0, x - 0) : 0;
    const edgeRight = i === s.length - 1 ? Math.max(0, B - x) : 0;
    return left + right + edgeLeft + edgeRight;
  });
}

/**
 * Высотные отметки, мм от верха фундамента.
 *
 * Один источник и для расчёта, и для чертежа, и для спецификации: иначе
 * разрез показывает одну длину столба, а смета другую.
 *
 *   прогон лежит на наружном столбе, стропила лежат на прогоне;
 *   у стены стропила лежат на обвязке, обвязка — на стеновом столбе,
 *   поэтому стеновой столб ниже отметки стропил на высоту обвязки.
 */
function levels(m) {
  const rise = m.geom.L * Math.tan((m.geom.alpha * Math.PI) / 180);
  const purlinH = section(m.purlin.sectionId).h;
  const wallPurlinH = section(m.wallPurlin.sectionId).h;
  const rafterH = section(m.rafters.sectionId).h;

  const postTop = m.geom.postHeight;
  const rafterBottomOuter = postTop + purlinH;
  const rafterBottomWall = rafterBottomOuter + rise;
  const wallPostTop = rafterBottomWall - wallPurlinH;
  const canopyTopWall = rafterBottomWall + rafterH;

  return {
    rise, purlinH, wallPurlinH, rafterH,
    postTop, wallPostTop,
    rafterBottomOuter, rafterBottomWall, canopyTopWall,
    houseRoof: canopyTopWall + m.geom.driftH,
    /** длины для спецификации: +300 мм на заделку в фундамент */
    postLength: postTop + 300,
    wallPostLength: wallPostTop + 300,
  };
}

/**
 * Отметки сквозных шпилек по высоте стенового столба, мм от базы.
 * Крайние отступают от концов, чтобы не рвать газоблок у края.
 */
function boltHeights(H, n) {
  if (n <= 1) return [H * 0.55];
  const lo = H * 0.12, hi = H * 0.92;
  return Array.from({ length: n }, (_, i) => lo + ((hi - lo) * i) / (n - 1));
}

/* ── src/core/share.js ── */
/**
 * Упаковка модели в ссылку.
 *
 * В URL кладётся не вся модель, а только отличия от значений по умолчанию —
 * тогда ссылка на слегка изменённый расчёт остаётся короткой, а новые поля,
 * появившиеся в программе позже, подставятся из текущих умолчаний.
 */

const isPlain = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

/** Разница между моделью и эталоном: только изменённые листья и массивы целиком. */
function diffModel(model, base = defaultModel()) {
  const out = {};
  for (const [k, v] of Object.entries(model)) {
    const b = base?.[k];
    if (isPlain(v) && isPlain(b)) {
      const d = diffModel(v, b);
      if (Object.keys(d).length) out[k] = d;
    } else if (JSON.stringify(v) !== JSON.stringify(b)) {
      out[k] = v;
    }
  }
  return out;
}

/** Накладывает разницу на эталон. Неизвестные ключи игнорируются. */
function mergeModel(patch, base = defaultModel()) {
  const out = Array.isArray(base) ? [...base] : { ...base };
  if (!isPlain(patch)) return out;
  for (const [k, v] of Object.entries(patch)) {
    if (!(k in out)) continue;
    out[k] = isPlain(v) && isPlain(out[k]) ? mergeModel(v, out[k]) : v;
  }
  return out;
}

function toBase64Url(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function fromBase64Url(code) {
  const b64 = code.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4));
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

/** Модель → строка для адресной строки. */
function encodeModel(model) {
  return toBase64Url(JSON.stringify(diffModel(model)));
}

/** Строка из адресной строки → модель. null, если строка испорчена. */
function decodeModel(code) {
  try {
    const patch = JSON.parse(fromBase64Url(code));
    if (!isPlain(patch)) return null;
    return mergeModel(patch);
  } catch {
    return null;
  }
}

/* ── src/core/analysis.js ── */
/**
 * Сборка расчёта: передача нагрузок по цепочке и проверки всех элементов.
 *
 * кровля → обрешётка → стропила → { прогон | брус у стены } → столбы → фундамент
 *
 * Единицы: мм, Н, Н/мм (= кН/м), МПа, кПа.
 */






const deg = (d) => (d * Math.PI) / 180;

/** Жёсткости сечения для решателя. */
function stiffness(sec, mat) {
  const p = sec.props;
  return { EI: mat.E * p.Ix, GAs: mat.G * p.As };
}

/** Собственный вес кровельного «пирога» без стропил, кН/м² по скату. */
function roofDead(model) {
  const roof = ROOFING[model.roofing];
  const batten = section(model.battens.sectionId);
  const gBatten = (batten.weight * 1000) / model.battens.spacing; // кН/м / мм → кН/м²
  return { roof: roof.g, batten: gBatten, total: roof.g + gBatten, def: roof };
}

/* ───────────────────────── СТРОПИЛА ───────────────────────── */

function analyseRafter(model, x, trib, ctx) {
  const { geom } = model;
  const sec = section(model.rafters.sectionId);
  const mat = propsFor(sec, model.opts);
  const { EI, GAs } = stiffness(sec, mat);
  const al = deg(geom.alpha), ca = Math.cos(al), sa = Math.sin(al);

  const Ls = (geom.L + geom.a) / ca;      // полная длина по скату
  const xSup = geom.L / ca;               // опора на прогон
  const supports = [0, xSup];
  const gammaDead = sec.material === 'timber' ? GAMMA_F.timber : GAMMA_F.steel;

  // погонные нагрузки, Н/мм, перпендикулярно скату
  const lineRoofN = (ctx.dead.roof * trib) / 1000;
  const lineBattenN = (ctx.dead.batten * trib) / 1000;
  const lineSelfN = sec.weight;
  const deadPerpN = (lineRoofN + lineBattenN + lineSelfN) * ca;
  const deadPerpD = (GAMMA_F.roofing * lineRoofN + gammaDead * (lineBattenN + lineSelfN)) * ca;

  const windUpPerp = (ctx.wind.up * trib) / 1000;
  const windDownPerp = (ctx.wind.down * trib) / 1000;

  // Схема Б.8 требует считать нижнее покрытие в двух вариантах — равномерном
  // и со снеговым мешком. За расчётное принимается худшее из них, причём
  // поэлементно: у стены правит мешок, в дальней части — равномерный снег.
  const solve = (q) => solveBeam({ length: Ls, supports, EI, GAs, q, nEl: 120 });
  const byVariant = ctx.snow.variants.map((v) => {
    const snowAt = (xs) => (v.at(xs * ca) * trib) / 1000 * ca * ca;
    return {
      variant: v,
      'ULS-1': solve((xs) => deadPerpD + GAMMA_F.snow * snowAt(xs)),
      'ULS-2': solve((xs) => deadPerpD + GAMMA_F.snow * snowAt(xs) + 0.9 * windDownPerp),
      SLS: solve((xs) => deadPerpN + snowAt(xs)),
    };
  });
  const uplift = solve(() => GAMMA_F.relieving * deadPerpN - windUpPerp);

  // определяющий вариант — тот, где больше момент в пролёте
  const peak = (r) => r.M.reduce((m, v) => Math.max(m, Math.abs(v)), 0);
  const lead = byVariant.reduce((a, b) => (peak(b['ULS-1']) > peak(a['ULS-1']) ? b : a));
  const res = { 'ULS-1': lead['ULS-1'], 'ULS-2': lead['ULS-2'], 'ULS-3': uplift, SLS: lead.SLS };

  // огибающая по всем вариантам и сочетаниям
  let Mmax = 0, Vmax = 0, Mcant = 0;
  const iSup = Math.round((xSup / Ls) * (uplift.x.length - 1));
  const envelope = byVariant.flatMap((g) => [g['ULS-1'], g['ULS-2']]).concat([uplift]);
  for (const r of envelope) {
    for (let i = 0; i < r.M.length; i++) {
      if (Math.abs(r.M[i]) > Math.abs(Mmax)) Mmax = r.M[i];
      if (Math.abs(r.V[i]) > Math.abs(Vmax)) Vmax = r.V[i];
    }
    if (Math.abs(r.M[iSup]) > Math.abs(Mcant)) Mcant = r.M[iSup];
  }

  // осевое сжатие вдоль стропила: вертикальная нагрузка × sin α, накапливается
  // к нижней опоре (внешние реакции при этом вертикальные — распора нет)
  const totalPerp = Math.max(...byVariant.map((g) => g['ULS-1'].reactions.reduce((sum, r) => sum + r.R, 0)));
  const N = totalPerp * (sa / ca);

  // прогибы — тоже огибающая по вариантам загружения
  const spans = deflectionSpans(byVariant[0].SLS, Ls, supports).spans;
  for (const g of byVariant.slice(1)) {
    deflectionSpans(g.SLS, Ls, supports).spans.forEach((sp, i) => {
      if (sp.f > spans[i].f) spans[i] = sp;
    });
  }
  const cantLen = Ls - xSup;
  const lambda = xSup / (sec.material === 'timber' ? sec.h / Math.sqrt(12) : sec.props.ix);

  const checks = [];
  if (sec.material === 'timber') {
    checks.push(timberBending(Mmax, sec.props.Wx, mat));
    checks.push(timberShear(Vmax, sec, mat));
    checks.push(timberCombined(N, Mmax, sec, mat, lambda));
    if (cantLen > 200) checks.push(timberLateral(Mcant, sec, mat, cantLen));
    checks.push(timberBearing(Math.max(...byVariant.map((g) => g['ULS-1'].reactions[1].R)), sec, mat, model.opts.bearingLength));
  } else {
    checks.push(steelBending(Mmax, sec.props.Wx, mat));
    checks.push(steelShear(Vmax, sec.props, mat));
    checks.push(steelBeamColumn(N, Mmax, sec.props, mat, xSup, 'x'));
    checks.push(steelLocalBuckling(sec, mat, 0));
  }
  checks.push(deflectionCheck(spans, 200));

  const w = worstOf(checks);
  return {
    x, trib, sec, mat, Ls, xSup, cantLen, N, Mmax, Vmax, spans,
    res,
    variant: lead.variant.label,
    reactions: {
      wall: Math.max(...byVariant.map((g) => g['ULS-1'].reactions[0].R)),
      purlin: Math.max(...byVariant.map((g) => g['ULS-1'].reactions[1].R)),
      wallUplift: uplift.reactions[0].R,
      purlinUplift: uplift.reactions[1].R,
      wallSls: Math.max(...byVariant.map((g) => g.SLS.reactions[0].R)),
      purlinSls: Math.max(...byVariant.map((g) => g.SLS.reactions[1].R)),
    },
    ...w,
  };
}

/* ───────────────────────── ОБРЕШЁТКА ───────────────────────── */

function analyseBattens(model, ctx) {
  const sec = section(model.battens.sectionId);
  const mat = propsFor(sec, model.opts);
  const { EI, GAs } = stiffness(sec, mat);
  const xs = [...model.rafters.xs].sort((a, b) => a - b);
  const B = model.geom.B;
  const gammaDead = sec.material === 'timber' ? GAMMA_F.timber : GAMMA_F.steel;
  const ca = Math.cos(deg(model.geom.alpha));

  // худшее место — у стены, там снеговой мешок
  const sp = model.battens.spacing;
  const deadN = ((ctx.dead.roof * sp) / 1000 + sec.weight) * ca;
  const deadD = (GAMMA_F.roofing * (ctx.dead.roof * sp) / 1000 + gammaDead * sec.weight) * ca;
  const snowD = (Math.max(...ctx.snow.variants.map((v) => v.at(0))) * sp) / 1000 * ca * ca;

  const uls = solveBeam({ length: B, supports: xs, EI, GAs, q: () => deadD + GAMMA_F.snow * snowD, nEl: 160 });
  const sls = solveBeam({ length: B, supports: xs, EI, GAs, q: () => deadN + snowD, nEl: 160 });

  // сосредоточенная 1 кН (СП 20 п. 8.3.4) в середине наибольшего пролёта
  let span = 0, mid = B / 2;
  for (let i = 0; i + 1 < xs.length; i++) {
    if (xs[i + 1] - xs[i] > span) { span = xs[i + 1] - xs[i]; mid = (xs[i] + xs[i + 1]) / 2; }
  }
  const point = solveBeam({ length: B, supports: xs, EI, GAs, q: () => deadD, point: [{ x: mid, P: 1000 }], nEl: 160 });

  const Mmax = Math.abs(uls.maxM) > Math.abs(point.maxM) ? uls.maxM : point.maxM;
  const Vmax = Math.abs(uls.maxV) > Math.abs(point.maxV) ? uls.maxV : point.maxV;
  const spans = deflectionSpans(sls, B, xs).spans;

  const checks = [];
  if (sec.material === 'timber') {
    checks.push(timberBending(Mmax, sec.props.Wx, mat));
    checks.push(timberShear(Vmax, sec, mat));
  } else {
    checks.push(steelBending(Mmax, sec.props.Wx, mat));
    checks.push(steelShear(Vmax, sec.props, mat));
  }
  checks.push(deflectionCheck(spans, 150));
  // ограничение производителя кровли по пролёту обрешётки
  checks.push({
    name: 'Пролёт под кровлю',
    value: span, limit: ctx.dead.def.maxBatten, unit: 'мм',
    U: span / ctx.dead.def.maxBatten,
    formula: 'шаг стропил ≤ допустимого пролёта покрытия',
    note: ctx.dead.def.label,
  });

  return { sec, mat, span, res: { uls, sls, point }, spans, ...worstOf(checks) };
}

/* ───────────────────── ПРОГОН И БРУС У СТЕНЫ ───────────────────── */

function analyseLineBeam(model, sectionId, supports, loads, label) {
  const sec = section(sectionId);
  const mat = propsFor(sec, model.opts);
  const { EI, GAs } = stiffness(sec, mat);
  const B = model.geom.B;
  const gammaDead = sec.material === 'timber' ? GAMMA_F.timber : GAMMA_F.steel;
  const self = sec.weight * gammaDead;

  const uls = solveBeam({ length: B, supports, EI, GAs, q: () => self, point: loads.uls, nEl: 160 });
  const sls = solveBeam({ length: B, supports, EI, GAs, q: () => sec.weight, point: loads.sls, nEl: 160 });
  const up = solveBeam({ length: B, supports, EI, GAs, q: () => 0, point: loads.uplift, nEl: 160 });

  const spans = deflectionSpans(sls, B, supports).spans;
  const checks = [];
  if (sec.material === 'timber') {
    checks.push(timberBending(uls.maxM, sec.props.Wx, mat));
    checks.push(timberShear(uls.maxV, sec, mat));
  } else {
    checks.push(steelBending(uls.maxM, sec.props.Wx, mat));
    checks.push(steelShear(uls.maxV, sec.props, mat));
  }
  checks.push(deflectionCheck(spans, 200));
  return { label, sec, mat, res: { uls, sls, up }, spans, reactions: uls.reactions, uplift: up.reactions, ...worstOf(checks) };
}

/* ───────────────────────── СТОЛБЫ ───────────────────────── */

/**
 * Ряд столбов под прогоном.
 * @param {object} cfg model.posts или model.wallPosts
 * @param {object} purlin результат расчёта прогона, лежащего на этом ряду
 * @param {{braced:boolean, thrust:number, alongWall:number}} extra
 *   braced — столб раскреплён стеной (сквозные шпильки);
 *   thrust — суммарный горизонтальный распор от ската и ветра на весь ряд, Н;
 *   alongWall — ветровая сила вдоль стены на весь ряд, Н.
 */
function analysePostRow(model, cfg, purlin, ctx, extra) {
  const sec = section(cfg.sectionId);
  const mat = propsFor(sec, model.opts);
  const lv = levels(model);
  const H = extra.braced ? lv.wallPostTop : lv.postTop;
  const lef = cfg.mu * H;
  const fascia = sec.h + 200;
  const n = purlin.reactions.length;
  const EI = mat.E * sec.props.Ix;
  const GAs = mat.G * sec.props.As;

  return purlin.reactions.map((r, i) => {
    const N = Math.max(0, r.R) + sec.weight * H * GAMMA_F.steel;
    const trib = i === 0 || i === n - 1 ? model.geom.B / (2 * Math.max(1, n - 1)) : model.geom.B / Math.max(1, n - 1);
    const Hwind = extra.braced ? 0 : (ctx.wind.lateral * fascia * trib) / 1e6 * 1000;
    const Hpost = (extra.thrust ?? 0) / n + Hwind;
    const Mecc = N * model.opts.postEccentricity;
    const Nup = -(purlin.uplift[i]?.R ?? 0);

    // эпюры по высоте столба: горизонтальная сила и момент от эксцентриситета
    // приложены вверху, в уровне опирания прогона
    let diagram, bolts = null;
    if (extra.braced) {
      // столб держат сквозные шпильки — балка на опорах в их отметках плюс база
      const zs = boltHeights(H, Math.max(1, cfg.boltCount));
      diagram = solveBeam({
        length: H, supports: [0, ...zs], EI, GAs,
        point: [{ x: H, P: Hpost }], moments: [{ x: H, M: Mecc }], nEl: 80,
      });
      const forces = diagram.reactions.slice(1).map((x) => Math.abs(x.R));
      const Nbolt = Math.max(0, ...forces);
      const Vbolt = Math.max(Math.max(0, Nup), (extra.alongWall ?? 0) / n) / Math.max(1, cfg.boltCount);
      bolts = { Nbolt, Vbolt, count: cfg.boltCount, heights: zs, forces };
    } else {
      // отдельно стоящий столб — консоль, защемлённая в фундаменте
      const nS = 121, x = new Float64Array(nS), M = new Float64Array(nS), V = new Float64Array(nS), w = new Float64Array(nS);
      for (let k = 0; k < nS; k++) {
        const z = (H * k) / (nS - 1);
        x[k] = z;
        V[k] = Hpost;
        M[k] = Mecc + Hpost * (H - z);
        w[k] = (Hpost * z * z * (3 * H - z)) / 6 / EI + (Mecc * z * z) / 2 / EI;
      }
      diagram = { x, M, V, w, reactions: [{ x: 0, R: Hpost }], maxM: M[0], maxV: Hpost };
    }
    let M = 0;
    for (let k = 0; k < diagram.M.length; k++) if (Math.abs(diagram.M[k]) > Math.abs(M)) M = diagram.M[k];

    const stab = steelStability(N, sec.props, mat, lef, 'y');
    const checks = [
      stab,
      steelBeamColumn(N, M, sec.props, mat, lef, 'x'),
      steelSlenderness(stab.lambda, stab.U),
      steelLocalBuckling(sec, mat, stab.lb),
    ];
    if (bolts) {
      const bChecks = [
        boltPlateBearing(bolts.Nbolt, cfg.plateSize, cfg.boltDiameter, cfg.blockClass),
        boltHoleBearing(bolts.Vbolt, cfg.boltDiameter, cfg.wallThickness, cfg.blockClass),
        boltShear(bolts.Vbolt, cfg.boltDiameter, cfg.boltGrade),
      ];
      Object.assign(bolts, worstOf(bChecks));
      checks.push(...bChecks);
    }

    return {
      x: r.x, N, M, Nup, Hpost, sec, mat, lef, H, bolts, diagram,
      braced: !!extra.braced, ...worstOf(checks),
    };
  });
}

/* ───────────────────────── ВСЁ ВМЕСТЕ ───────────────────────── */

/**
 * Кровельная часть (нагрузки, стропила, обрешётка) не зависит от положения
 * и сечений столбов, поэтому её результат переиспользуется между вызовами —
 * иначе перетаскивание столба каждый кадр пересчитывало бы все стропила.
 */
let roofMemo = { key: null, value: null };

function analyseRoof(model) {
  const key = JSON.stringify([model.geom, model.site, model.roofing, model.rafters, model.battens, model.opts]);
  if (roofMemo.key === key) return roofMemo.value;

  const { geom } = model;
  const dead = roofDead(model);
  const snow = snowProfile(model.site, geom.alpha, { driftH: geom.driftH, depth: geom.L + geom.a, width: geom.B, alpha: geom.alpha });
  const zTop = levels(model).canopyTopWall;
  const wind = windPressure(model.site, zTop);
  const ctx = { dead, snow, wind };

  const xs = [...model.rafters.xs].sort((a, b) => a - b);
  const tribs = tributaries(xs, geom.B);
  const cache = new Map();
  const rafters = xs.map((x, i) => {
    const k = Math.round(tribs[i] * 10);
    if (!cache.has(k)) cache.set(k, analyseRafter(model, 0, tribs[i], ctx));
    return { ...cache.get(k), x, index: i };
  });
  const battens = analyseBattens(model, ctx);

  roofMemo = { key, value: { ctx, dead, snow, wind, rafters, battens } };
  return roofMemo.value;
}

function analyse(model) {
  const { geom } = model;
  const { ctx, dead, snow, wind, rafters, battens } = analyseRoof(model);

  const pick = (key) => rafters.map((r) => ({ x: r.x, P: r.reactions[key] }));

  const outerXs = [...model.posts.xs].sort((a, b) => a - b);
  const purlin = analyseLineBeam(model, model.purlin.sectionId, outerXs,
    { uls: pick('purlin'), sls: pick('purlinSls'), uplift: pick('purlinUplift') }, 'Прогон по столбам');

  const wallXs = [...model.wallPosts.xs].sort((a, b) => a - b);
  const wallPurlin = analyseLineBeam(model, model.wallPurlin.sectionId, wallXs,
    { uls: pick('wall'), sls: pick('wallSls'), uplift: pick('wallUplift') }, 'Обвязка у стены');

  // ── горизонтальные силы, которые должен принять стеновой ряд.
  // Сила тяжести распора не даёт: опоры вертикальные, ΣH = 0. Горизонталь — только ветер:
  // горизонтальная проекция давления по нормали к скату плюс напор на наружную кромку.
  const al = deg(geom.alpha);
  const roofArea = (geom.B * (geom.L + geom.a)) / 1e6; // м²
  const fasciaH = section(model.rafters.sectionId).h + 200;
  const thrustRoof = wind.up * roofArea * Math.sin(al) * 1000;
  const thrustFascia = wind.lateral * ((fasciaH * geom.B) / 1e6) * 1000;
  const thrust = thrustRoof + thrustFascia;
  const alongWall = wind.lateral * ((fasciaH * geom.L) / 1e6) * 1000;

  const posts = analysePostRow(model, model.posts, purlin, ctx, { braced: false, thrust: 0, alongWall: 0 });
  const wallPosts = analysePostRow(model, model.wallPosts, wallPurlin, ctx, { braced: true, thrust, alongWall });

  const maxUplift = Math.max(0, ...posts.map((p) => p.Nup));
  const foundation = {
    uplift: maxUplift,
    requiredMass: maxUplift / 0.9 / 1000,
    cubeSide: Math.cbrt(Math.max(0.001, maxUplift / 0.9 / 1000 / 24)) * 1000,
    maxDown: Math.max(...posts.map((p) => p.N)),
  };

  const rowWorst = (list) => list.reduce((a, b) => (a.U > b.U ? a : b));
  const all = [
    { key: 'battens', label: 'Обрешётка', U: battens.U, worst: battens.worst },
    { key: 'rafters', label: 'Стропила', U: Math.max(...rafters.map((r) => r.U)), worst: rowWorst(rafters).worst },
    { key: 'purlin', label: 'Прогон наружный', U: purlin.U, worst: purlin.worst },
    { key: 'posts', label: 'Столбы наружные', U: Math.max(...posts.map((p) => p.U)), worst: rowWorst(posts).worst },
    { key: 'wallPurlin', label: 'Обвязка у стены', U: wallPurlin.U, worst: wallPurlin.worst },
    { key: 'wallPosts', label: 'Столбы у стены', U: Math.max(...wallPosts.map((p) => p.U)), worst: rowWorst(wallPosts).worst },
  ];

  return {
    model, ctx, dead, snow, wind,
    rafters, battens, purlin, wallPurlin, posts, wallPosts, foundation,
    thrust: { total: thrust, roof: thrustRoof, fascia: thrustFascia, alongWall },
    summary: all,
    maxU: Math.max(...all.map((a) => a.U)),
  };
}

/**
 * Спецификация и массы.
 *
 * Формулы:
 *   дерево   V = b·h·L·n,            m = V·ρ,   ρ = 500 кг/м³
 *   сталь    m = A·L·n·ρ,            ρ = 7850 кг/м³  (то же, что A[см²]·0,785 кг/м)
 *   кровля   m = g·S/g₀,             g — кН/м² по скату, S — площадь ската
 *   шпилька  m = π/4·d²·L·ρ_ст,      пластина m = a²·t·ρ_ст
 *
 * Стоимость: дерево — по объёму (V·цена за м³), металл — по массе (m·цена за кг),
 * кровля — по площади ската, метизы — поштучно. Цены задаёт пользователь.
 *
 * Собственный вес всех этих элементов уже входит в расчёт нагрузок:
 * стропила и прогоны — погонным весом сечения, обрешётка — весом на 1 м²,
 * столбы — весом ствола в осевой силе.
 */
function billOfMaterials(result) {
  const m = result.model;
  const stock = m.opts.stockLength ?? 6000;
  const pr = m.prices ?? { timberM3: 0, steelKg: 0, roofingM2: 0, fastenerPc: 0, currency: '₽' };
  const G0 = 9.80665;
  const items = [];
  const add = (name, sec, lengthMm, count) => {
    const isT = sec.material === 'timber';
    const perStock = Math.max(1, Math.floor(stock / lengthMm));
    const volume = (sec.props.A * lengthMm * count) / 1e9; // м³
    const mass = (sec.massPerM * lengthMm * count) / 1000;
    items.push({
      name,
      section: sec.label,
      material: isT ? 'сосна' : 'сталь',
      count,
      length: Math.round(lengthMm),
      totalLength: (lengthMm * count) / 1000,
      stockPieces: lengthMm > stock ? null : Math.ceil(count / perStock),
      volume: isT ? volume : null,
      mass,
      unitPrice: isT ? pr.timberM3 : pr.steelKg,
      unit: isT ? '₽/м³' : '₽/кг',
      cost: isT ? volume * pr.timberM3 : mass * pr.steelKg,
    });
  };
  const ca = Math.cos(deg(m.geom.alpha));
  add('Стропила', section(m.rafters.sectionId), (m.geom.L + m.geom.a) / ca + 100, m.rafters.xs.length);
  const nBatten = Math.floor((m.geom.L + m.geom.a) / ca / m.battens.spacing) + 1;
  add('Обрешётка', section(m.battens.sectionId), m.geom.B, nBatten);
  add('Обвязка у стены', section(m.wallPurlin.sectionId), m.geom.B, 1);
  add('Прогон наружный', section(m.purlin.sectionId), m.geom.B, 1);
  const lv = levels(m);
  add('Столбы наружные', section(m.posts.sectionId), lv.postLength, m.posts.xs.length);
  add('Столбы у стены', section(m.wallPosts.sectionId), lv.wallPostLength, m.wallPosts.xs.length);

  // кровля
  const roofArea = (m.geom.B * ((m.geom.L + m.geom.a) / ca)) / 1e6; // м² по скату
  const roofMass = (result.dead.roof * roofArea * 1000) / G0;

  // метизы
  const wp = m.wallPosts;
  const boltLen = wp.wallThickness + 120;
  const boltCount = wp.boltCount * wp.xs.length;
  const boltMass = (Math.PI / 4) * wp.boltDiameter ** 2 * boltLen * boltCount * 7.85e-6;
  const plateMass = wp.plateSize ** 2 * 8 * boltCount * 7.85e-6;
  const fasteners = [
    { name: `Шпилька М${wp.boltDiameter} класса ${wp.boltGrade}`, count: boltCount,
      note: `длина ≥ ${boltLen} мм`, mass: boltMass, cost: boltCount * pr.fastenerPc },
    { name: `Пластина-шайба ${wp.plateSize}×${wp.plateSize}×8 мм`, count: boltCount,
      note: 'с внутренней стороны стены, под гайку с шайбой', mass: plateMass, cost: 0 },
  ];

  const sum = (f) => items.filter(f).reduce((a, i) => a + (i.mass ?? 0), 0);
  const byName = (n) => items.find((i) => i.name === n)?.mass ?? 0;
  // всё, что висит над головой (без столбов) — это и есть постоянная нагрузка на кровлю
  const roofPartMass = byName('Стропила') + byName('Обрешётка') + byName('Обвязка у стены')
    + byName('Прогон наружный') + roofMass;
  const timberVolume = items.reduce((a, i) => a + (i.volume ?? 0), 0);
  const timberMass = sum((i) => i.material === 'сосна');
  const steelMass = sum((i) => i.material === 'сталь');
  const steelLength = items.filter((i) => i.material === 'сталь').reduce((a, i) => a + i.totalLength, 0);
  const fastenerMass = fasteners.reduce((a, f) => a + f.mass, 0);
  const total = timberMass + steelMass + roofMass + fastenerMass;
  const planArea = (m.geom.B * (m.geom.L + m.geom.a)) / 1e6; // м² в плане

  const groups = [
    { name: 'Кровельное покрытие', mass: roofMass, note: ROOFING[m.roofing].label },
    { name: 'Обрешётка', mass: byName('Обрешётка'), note: 'сосна' },
    { name: 'Стропила', mass: byName('Стропила'), note: 'сосна' },
    { name: 'Прогоны и обвязка', mass: byName('Прогон наружный') + byName('Обвязка у стены'), note: 'сталь + сосна' },
    { name: 'Столбы', mass: byName('Столбы наружные') + byName('Столбы у стены'), note: 'сталь' },
    { name: 'Метизы', mass: boltMass + plateMass, note: 'шпильки и пластины' },
  ];

  const weights = {
    timber: { volume: timberVolume, mass: timberMass, density: 500 },
    steel: { mass: steelMass, length: steelLength, density: 7850 },
    roofing: { area: roofArea, mass: roofMass, label: ROOFING[m.roofing].label },
    fasteners: { mass: fastenerMass, count: boltCount * 2 },
    total,
    perSqm: total / planArea,
    planArea,
    /** нагрузка от собственного веса всей кровельной части, кПа по скату */
    deadPressure: (roofPartMass * G0) / roofArea / 1000,
    /** доля собственного веса в полной нагрузке у стены и в поле */
    deadShareWall: null,
    deadShareField: null,
    groups,
  };
  const dp = weights.deadPressure;
  weights.deadShareWall = dp / (dp + result.snow.at(0));
  weights.deadShareField = dp / (dp + result.snow.at(m.geom.L + m.geom.a));

  const costTimber = items.filter((i) => i.material === 'сосна').reduce((a, i) => a + i.cost, 0);
  const costSteel = items.filter((i) => i.material === 'сталь').reduce((a, i) => a + i.cost, 0);
  const costRoofing = roofArea * pr.roofingM2;
  const costFasteners = fasteners.reduce((a, f) => a + (f.cost ?? 0), 0);
  const costs = {
    currency: pr.currency ?? '₽',
    prices: pr,
    timber: costTimber,
    steel: costSteel,
    roofing: costRoofing,
    fasteners: costFasteners,
    total: costTimber + costSteel + costRoofing + costFasteners,
    perSqm: (costTimber + costSteel + costRoofing + costFasteners) / planArea,
    groups: [
      { name: 'Кровельное покрытие', cost: costRoofing, base: `${roofArea.toFixed(1)} м² × ${pr.roofingM2} ₽/м²` },
      { name: 'Сосна', cost: costTimber, base: `${timberVolume.toFixed(3)} м³ × ${pr.timberM3} ₽/м³` },
      { name: 'Сталь', cost: costSteel, base: `${steelMass.toFixed(0)} кг × ${pr.steelKg} ₽/кг` },
      { name: 'Метизы', cost: costFasteners, base: `${boltCount} компл. × ${pr.fastenerPc} ₽` },
    ],
  };

  return { items, fasteners, weights, costs, timberVolume, timberMass, steelMass, steelLength, stock, total };
}

/* ── src/core/optimize.js ── */
/** Автоподбор сечений и шагов. */



const PATH = {
  rafters: (m, id) => ({ ...m, rafters: { ...m.rafters, sectionId: id } }),
  battens: (m, id) => ({ ...m, battens: { ...m.battens, sectionId: id } }),
  purlin: (m, id) => ({ ...m, purlin: { ...m.purlin, sectionId: id } }),
  wallPurlin: (m, id) => ({ ...m, wallPurlin: { ...m.wallPurlin, sectionId: id } }),
  wallPosts: (m, id) => ({ ...m, wallPosts: { ...m.wallPosts, sectionId: id } }),
  posts: (m, id) => ({ ...m, posts: { ...m.posts, sectionId: id } }),
};

const U_OF = {
  rafters: (r) => Math.max(...r.rafters.map((x) => x.U)),
  battens: (r) => r.battens.U,
  purlin: (r) => r.purlin.U,
  wallPurlin: (r) => r.wallPurlin.U,
  wallPosts: (r) => Math.max(...r.wallPosts.map((x) => x.U)),
  posts: (r) => Math.max(...r.posts.map((x) => x.U)),
};

/**
 * Подобрать минимальное сечение элемента, при котором U ≤ target.
 * @returns {{id:string,U:number,tried:{id:string,U:number}[]}|null}
 */
function pickSection(model, key, target = 0.95) {
  const current = section(model[key].sectionId);
  const candidates = ladder(current.material).filter((s) =>
    key === 'posts' || key === 'wallPosts' ? s.h === s.b || s.h / s.b <= 2 : true
  );
  const tried = [];
  for (const cand of candidates) {
    const m = PATH[key](model, cand.id);
    let U;
    try { U = U_OF[key](analyse(m)); } catch { continue; }
    tried.push({ id: cand.id, label: cand.label, U });
    if (U <= target) return { id: cand.id, label: cand.label, U, tried };
  }
  return null;
}

/**
 * Подобрать число стропил (шаг) при неизменном сечении.
 * @returns {{count:number,step:number,U:number}|null}
 */
function pickRafterSpacing(model, target = 0.95, maxCount = 31) {
  for (let n = 4; n <= maxCount; n++) {
    const m = { ...model, rafters: { ...model.rafters, xs: spread(model.geom.B, n) } };
    const r = analyse(m);
    const U = Math.max(U_OF.rafters(r), r.battens.U);
    if (U <= target) return { count: n, step: model.geom.B / (n - 1), U };
  }
  return null;
}

/** Подобрать все элементы подряд, снизу вверх по цепочке. */
function pickAll(model, target = 0.9) {
  let m = model;
  const log = [];
  for (const key of ['battens', 'rafters', 'purlin', 'wallPurlin', 'posts', 'wallPosts']) {
    const r = pickSection(m, key, target);
    if (r) {
      m = PATH[key](m, r.id);
      log.push({ key, label: r.label, U: r.U });
    } else {
      log.push({ key, label: null, U: null });
    }
  }
  return { model: m, log };
}
